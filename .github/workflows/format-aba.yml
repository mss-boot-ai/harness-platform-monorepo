name: Apply locked ABA Rust formatting

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation
    paths:
      - .github/workflows/format-aba.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-aba-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger context and lock
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "codex/bootstrap-harness-platform-foundation"
          test "${GITHUB_REF_NAME}" != "main"
          test -s aba/Cargo.toml
          test -s aba/Cargo.lock

      - name: Install the locked formatter
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustfmt +1.88.0 --version

      - name: Format ABA sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cd aba
          cargo +1.88.0 fmt --all
          cd ..
          git diff --check

      - name: Commit and push formatting corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          git add aba
          if git diff --cached --quiet; then
            echo "error: cargo fmt produced no change; remove this one-time workflow manually" >&2
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(aba): apply Rust 1.88 formatting [skip aba format]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
