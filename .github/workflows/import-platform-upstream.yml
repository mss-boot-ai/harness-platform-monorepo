name: Import pinned Platform upstream

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation
    paths:
      - .github/workflows/import-platform-upstream.yml
      - scripts/import-mss-boot-admin.sh
      - scripts/verify-platform-upstream.sh
      - platform/.upstream/mss-boot-admin.lock.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-platform-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger context and locked provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "codex/bootstrap-harness-platform-foundation"
          test "${GITHUB_REF_NAME}" != "main"
          ./scripts/verify-platform-upstream.sh --lock-only

      - name: Import and verify the exact upstream source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f platform/go.mod ]]; then
            echo "error: platform/go.mod already exists; this one-time importer refuses to overwrite it" >&2
            exit 2
          fi
          ./scripts/import-mss-boot-admin.sh
          test -f platform/go.mod
          test -s platform/.upstream/import-manifest.txt

      - name: Commit and push the isolated upstream import
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A platform
          if git diff --cached --quiet; then
            echo "error: the importer produced no Platform changes" >&2
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(platform): import mss-boot-admin v1.3.7 [skip import]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
