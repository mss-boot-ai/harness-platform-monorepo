name: Apply Durable Control Review Repair

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation

permissions:
  contents: write

concurrency:
  group: apply-durable-control-review-repair
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore(ci): trigger durable control review repair' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify expected ancestry and staged archive
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 73cc5d24b2453a61239ce2b5ecde9dc98d75b2c5 HEAD
          compgen -G '.review-fix/group2.part*' >/dev/null
          test -z "$(git status --porcelain)"

      - name: Restore durable-control patch
        shell: bash
        run: |
          set -Eeuo pipefail
          find .review-fix -maxdepth 1 -type f -name 'group2.part*' -print0 \
            | sort -zV \
            | xargs -0 cat \
            | base64 --decode \
            | tar -xzf - -C .
          test -s platform/internal/harness/gateway/control_outbox.go
          test -s platform/internal/harness/store/session_create.go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: Format and run targeted Platform reliability checks
        working-directory: platform
        shell: bash
        run: |
          set -Eeuo pipefail
          gofmt -w internal/harness/gateway internal/harness/store
          go test -count=1 ./internal/harness/store ./internal/harness/gateway
          go test -race -count=1 ./internal/harness/store ./internal/harness/gateway
          go vet ./...

      - name: Commit validated repair and remove staging machinery
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .review-fix
          rm -f .github/workflows/apply-durable-control-review-repair.yml
          rm -f .github/workflows/apply-schema-contract-repair.yml
          git add --all
          git diff --cached --check
          git config user.name 'harness-review-repair[bot]'
          git config user.email 'harness-review-repair[bot]@users.noreply.github.com'
          git commit -m 'fix(relay): persist control delivery and stabilize session idempotency [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
