name: Remote Checkpoint
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remote-checkpoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reproducible-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify documentation and archive tracked source
        run: |
          set -Eeuo pipefail
          ./scripts/check-docs.sh
          mkdir -p "${RUNNER_TEMP}/remote-checkpoint"
          git rev-parse HEAD > "${RUNNER_TEMP}/remote-checkpoint/source-sha.txt"
          git archive --format=tar --prefix=harness/ HEAD | gzip -n > "${RUNNER_TEMP}/remote-checkpoint/source.tar.gz"
          cd "${RUNNER_TEMP}/remote-checkpoint"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: remote-source-${{ github.sha }}
          path: ${{ runner.temp }}/remote-checkpoint/
          if-no-files-found: error
          retention-days: 3
  runtime-duplex:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/device-fabric-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Prepare the reviewed source candidate
        if: hashFiles('.github/checkpoints/remote.patch') != ''
        run: python3 .github/scripts/prepare_candidate.py prepare
      - name: Compile and test Rust
        working-directory: aba
        run: |
          cargo +1.88.0 test --locked --workspace --all-targets
          cargo +1.88.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.88.0 build --locked --bin aba
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify HC against locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --dir hc install --frozen-lockfile
          pnpm --dir hc lint
          pnpm --dir hc typecheck
          pnpm --dir hc test
          pnpm --dir hc build
      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Compile a reproducible integration test binary
        working-directory: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/runtime-review/public-binaries"
          go test -c -race -o "${RUNNER_TEMP}/runtime-review/public-binaries/gateway.test" ./internal/harness/gateway
          cp ../aba/target/debug/aba ../aba/tests/fixtures/duplex_agent.py "${RUNNER_TEMP}/runtime-review/public-binaries/"
      - name: Verify actual-binary integration before publishing a candidate
        working-directory: platform
        env:
          HARNESS_TEST_ABA_BINARY: ${{ github.workspace }}/aba/target/debug/aba
          HARNESS_TEST_ACP_FIXTURE: ${{ github.workspace }}/aba/tests/fixtures/duplex_agent.py
        run: '"${RUNNER_TEMP}/runtime-review/public-binaries/gateway.test" -test.v -test.timeout=120s -test.run="^TestRemoteActualABAGatewayDuplex$"'
      - name: Upload verified immutable Git objects, never update refs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "${RUNNER_TEMP}/runtime-review/candidate-local.json"; then
            python3 .github/scripts/prepare_candidate.py publish
          fi
      - name: Record candidate metadata
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/runtime-review"
          git rev-parse HEAD > "${RUNNER_TEMP}/runtime-review/source-sha.txt"
          # Public source-built test programs only. Never archive runtime directories,
          # environments, endpoint credentials, checkout metadata or model keys.
          if test -d "${RUNNER_TEMP}/runtime-review/public-binaries"; then
            cd "${RUNNER_TEMP}/runtime-review/public-binaries"
            sha256sum * > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-runtime-review-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-review/
          if-no-files-found: warn
          retention-days: 3
