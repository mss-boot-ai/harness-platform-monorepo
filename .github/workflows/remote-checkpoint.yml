name: Remote Checkpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproducible-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify documentation and archive only tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/check-docs.sh
          mkdir -p "${RUNNER_TEMP}/remote-checkpoint"
          git rev-parse HEAD > "${RUNNER_TEMP}/remote-checkpoint/source-sha.txt"
          git archive --format=tar --prefix=harness/ HEAD | gzip -n > "${RUNNER_TEMP}/remote-checkpoint/source.tar.gz"
          cd "${RUNNER_TEMP}/remote-checkpoint"
          sha256sum source.tar.gz > SHA256SUMS
      - name: Upload reproducible source checkpoint (no credentials or runtime data)
        uses: actions/upload-artifact@v4
        with:
          name: remote-source-${{ github.sha }}
          path: ${{ runner.temp }}/remote-checkpoint/
          if-no-files-found: error
          retention-days: 3

  runtime-duplex:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/device-fabric-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Apply the reviewed integration patch and format a candidate
        if: hashFiles('.github/checkpoints/remote.patch') != ''
        run: python3 .github/scripts/prepare_candidate.py prepare
      - name: Compile and test the exact candidate
        working-directory: aba
        run: |
          cargo +1.88.0 test --locked --workspace --all-targets
          cargo +1.88.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the HC candidate against locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --dir hc install --frozen-lockfile
          pnpm --dir hc lint
          pnpm --dir hc typecheck
          pnpm --dir hc test
          pnpm --dir hc build
      - name: Upload verified Git objects, never update refs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "${RUNNER_TEMP}/runtime-review/candidate-local.json"; then
            python3 .github/scripts/prepare_candidate.py publish
          fi
      - name: Retain formatter tooling and review evidence
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/runtime-review/formatter/bin" "${RUNNER_TEMP}/runtime-review/formatter/lib"
          toolchain="$(rustup run 1.88.0 rustc --print sysroot)"
          cp "${toolchain}/bin/rustfmt" "${RUNNER_TEMP}/runtime-review/formatter/bin/"
          find "${toolchain}/lib" -maxdepth 1 -type f -name '*.so*' -exec cp {} "${RUNNER_TEMP}/runtime-review/formatter/lib/" \;
          git rev-parse HEAD > "${RUNNER_TEMP}/runtime-review/source-sha.txt"
          # Explicit public build dependencies only, never checkout credentials, npmrc,
          # local identities, runtime data, or host environments. Retain only when a
          # candidate was prepared; used for offline checks in the review container.
          if test -f "${RUNNER_TEMP}/runtime-review/candidate-local.json" && test -d hc/node_modules; then
            mkdir -p "${RUNNER_TEMP}/runtime-review/node-tools/bin"
            cp "$(command -v node)" "${RUNNER_TEMP}/runtime-review/node-tools/bin/"
            tar -czf "${RUNNER_TEMP}/runtime-review/hc-dependencies.tar.gz" -C hc node_modules packages/core/node_modules web/node_modules
          fi
      - name: Upload runtime review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-runtime-review-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-review/
          if-no-files-found: warn
          retention-days: 3
