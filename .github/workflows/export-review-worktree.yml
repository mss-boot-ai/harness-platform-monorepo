name: Export Review Worktree

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Pack review worktree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=review-worktree.tar.gz -czf review-worktree.tar.gz .

      - name: Upload review worktree
        uses: actions/upload-artifact@v4
        with:
          name: review-worktree-${{ github.sha }}
          path: review-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
