name: Export Review Worktree

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Pack review worktree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/review-worktree.tar.gz" .

      - name: Upload review worktree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-worktree-${{ github.sha }}
          path: ${{ runner.temp }}/review-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
