name: Trigger Review Repair

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation
    paths:
      - .github/workflows/review-repair-trigger.yml

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time trigger and wait for its CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/bootstrap-harness-platform-foundation
        run: |
          set -euo pipefail
          if [[ ! -f .github/workflows/review-repair-trigger.yml ]]; then
            exit 0
          fi
          git config user.name 'harness-review-repair[bot]'
          git config user.email 'harness-review-repair[bot]@users.noreply.github.com'
          git rm .github/workflows/review-repair-trigger.yml
          git commit -m 'chore(ci): remove one-time review repair trigger'
          git push origin "HEAD:${BRANCH}"
          sha=$(git rev-parse HEAD)
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=30")
            state=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and (.event == "push" or .event == "pull_request"))] | if length < 2 then "waiting" elif all(.status == "completed" and .conclusion == "success") then "success" elif any(.status == "completed" and .conclusion != "success") then "failed" else "waiting" end' <<<"${runs}")
            case "${state}" in
              success) break ;;
              failed) echo 'setup CI failed' >&2; exit 1 ;;
            esac
            sleep 10
          done
          [[ ${state} == success ]]
          gh workflow run review-repair.yml --ref "${BRANCH}"
