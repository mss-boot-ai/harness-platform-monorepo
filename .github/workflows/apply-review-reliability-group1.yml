name: Apply Review Reliability Group 1

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation
    paths:
      - .github/workflows/apply-review-reliability-group1.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'fix(ci): quote review reliability workflow condition'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Guard reviewed ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 9fc7a0c05354d0058d7c9292ebadf0cf0b844160 HEAD
          test -z "$(git status --porcelain)"
      - name: Apply reviewed files
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .review-fix/group1.part* > "$RUNNER_TEMP/group1.b64"
          base64 --decode "$RUNNER_TEMP/group1.b64" > "$RUNNER_TEMP/group1.tar.gz"
          tar -xzf "$RUNNER_TEMP/group1.tar.gz" -C "$GITHUB_WORKSPACE"
          gofmt -w \
            platform/internal/harness/domain/control_outbox.go \
            platform/internal/harness/store/*.go \
            platform/internal/modules/harness/module.go
          git diff --check
      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Verify store checkpoint before commit
        working-directory: platform
        run: |
          set -Eeuo pipefail
          go test -count=1 ./internal/harness/store
          go test -count=1 ./internal/modules/harness
          go vet ./...
      - name: Commit and push durable store checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git rm -r .review-fix .github/workflows/apply-review-reliability-group1.yml
          git add \
            platform/internal/harness/domain/control_outbox.go \
            platform/internal/harness/store \
            platform/internal/modules/harness/module.go
          git diff --cached --check
          git commit -m 'fix(store): persist reliable controls and enforce index contracts'
          git push origin HEAD:codex/bootstrap-harness-platform-foundation
