name: Review Repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repair script exists
        run: test -f scripts/review-repair.py
      - name: Run next repair checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPAIR_BASE: f843b4a515394332d7f9e3201de6899e58d8faff
          REPAIR_BRANCH: codex/bootstrap-harness-platform-foundation
        run: python3 scripts/review-repair.py
