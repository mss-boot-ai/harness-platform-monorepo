name: Generate pinned ABA Cargo lock

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation
    paths:
      - .github/workflows/generate-aba-lock.yml
      - aba/Cargo.toml
      - aba/rust-toolchain.toml
      - aba/.cargo/config.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-aba-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact topic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger context
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "codex/bootstrap-harness-platform-foundation"
          test "${GITHUB_REF_NAME}" != "main"
          test -f aba/Cargo.toml
          test ! -f aba/Cargo.lock

      - name: Install the locked Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustc +1.88.0 --version
          cargo +1.88.0 --version

      - name: Resolve and validate the dependency lock
        shell: bash
        run: |
          set -Eeuo pipefail
          cd aba
          cargo +1.88.0 generate-lockfile
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
          test -s Cargo.lock
          grep -Fq 'name = "agent-client-protocol"' Cargo.lock
          grep -Fq 'version = "2.0.0"' Cargo.lock

      - name: Commit and push Cargo.lock
        shell: bash
        run: |
          set -Eeuo pipefail
          git add aba/Cargo.lock
          if git diff --cached --quiet; then
            echo "error: Cargo lock generation produced no tracked change" >&2
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(aba): lock Rust dependencies [skip lock generation]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
