name: Converge PR Review Repairs

on:
  push:
    branches:
      - codex/review-repair-converger-20260905

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  converge:
    if: github.event.head_commit.message == 'chore(ci): converge PR review repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TARGET_BRANCH: codex/bootstrap-harness-platform-foundation
      SOURCE_BRANCH: codex/review-repair-orchestrator-20260905
      WATCHDOG_BRANCH: codex/review-repair-watchdog-20260905
      CONVERGER_BRANCH: codex/review-repair-converger-20260905
      REPO: mss-boot-ai/harness-platform-monorepo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Acquire exclusive repair ownership
        shell: bash
        run: |
          set -euo pipefail
          current="$GITHUB_RUN_ID"
          for branch in "$SOURCE_BRANCH" "$WATCHDOG_BRANCH"; do
            gh api "repos/${REPO}/actions/runs?branch=${branch}&per_page=100" --jq '.workflow_runs[] | [.id,.status] | @tsv' 2>/dev/null |
            while IFS=$'\t' read -r run status; do
              [[ "$run" == "$current" || "$status" == completed ]] && continue
              gh api -X POST "repos/${REPO}/actions/runs/${run}/cancel" >/dev/null 2>&1 || true
            done
          done
          gh api "repos/${REPO}/actions/workflows/apply-schema-contract-repair.yml/runs?branch=${TARGET_BRANCH}&per_page=20" \
            --jq '.workflow_runs[] | [.id,.status] | @tsv' 2>/dev/null |
          while IFS=$'\t' read -r run status; do
            [[ "$status" == completed ]] && continue
            gh api -X POST "repos/${REPO}/actions/runs/${run}/cancel" >/dev/null 2>&1 || true
          done
          sleep 30

      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: platform/go.mod
          cache: true
          cache-dependency-path: platform/go.sum

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Load repair sources and helpers
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin "${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"; then
            echo 'HAS_REPAIR_SOURCE=1' >> "$GITHUB_ENV"
            git show "origin/${SOURCE_BRANCH}:.github/workflows/supervise-review-repairs.yml" > /tmp/supervisor.yml
            git show "origin/${SOURCE_BRANCH}:.github/workflows/execute-review-repairs-v4.yml" > /tmp/v4.yml
          else
            echo 'HAS_REPAIR_SOURCE=0' >> "$GITHUB_ENV"
          fi
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          cat > /tmp/repair-lib.sh <<'SH'
          set -euo pipefail
          has_commit() { git log --format=%s | grep -Fxq "$1"; }
          checkpoint_sha() { git log --format='%H%x09%s' | awk -F '\t' -v wanted="$1" '$2 == wanted {print $1; exit}'; }
          require_source() { [[ "${HAS_REPAIR_SOURCE:-0}" == 1 ]] || { echo 'repair source branch is unavailable' >&2; exit 1; }; }
          extract_step() {
            local workflow="$1" name="$2" output="$3"
            require_source
            git show "origin/${SOURCE_BRANCH}:.github/workflows/${workflow}" > /tmp/source.yml
            python3 - "$name" "$output" <<'PY'
          from pathlib import Path
          import sys
          name, output = sys.argv[1], Path(sys.argv[2])
          lines = Path('/tmp/source.yml').read_text().splitlines()
          marker = f'- name: {name}'
          start = next(i for i, line in enumerate(lines) if line.strip() == marker)
          run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |') + 1
          end = next((i for i in range(run, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
          body = lines[run:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          output.write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
            chmod +x "$output"
          }
          extract_local_step() {
            local source="$1" name="$2" output="$3"
            python3 - "$source" "$name" "$output" <<'PY'
          from pathlib import Path
          import sys
          source, name, output = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          lines = source.read_text().splitlines()
          marker = f'- name: {name}'
          start = next(i for i, line in enumerate(lines) if line.strip() == marker)
          run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |') + 1
          end = next((i for i in range(run, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
          body = lines[run:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          output.write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
            chmod +x "$output"
          }
          wait_ci() {
            local sha="$1"
            for attempt in $(seq 1 220); do
              local runs push pr
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
              push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
              pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
              [[ "$push" == success && "$pr" == success ]] && return 0
              if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then
                echo "CI failed for ${sha}: push=${push} pr=${pr}" >&2
                return 1
              fi
              sleep 15
            done
            return 1
          }
          ensure_checkpoint_ci() { local sha; sha=$(checkpoint_sha "$1"); [[ -n "$sha" ]] && wait_ci "$sha"; }
          commit_checkpoint() {
            local message="$1" remote sha
            git diff --check
            remote=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
            test "$remote" = "$(git rev-parse HEAD)" || {
              echo "target changed: local=$(git rev-parse HEAD) remote=${remote}" >&2
              exit 1
            }
            git add -A
            git commit -m "$message"
            sha=$(git rev-parse HEAD)
            git push origin "HEAD:${TARGET_BRANCH}"
            wait_ci "$sha"
          }
          run_supervisor_step() {
            local name="$1" output=/tmp/supervisor-step.sh
            require_source
            extract_local_step /tmp/supervisor.yml "$name" "$output"
            "$output"
          }
          SH

      - name: Verify current Head and Draft boundary
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          wait_ci "$(git rev-parse HEAD)"
          pr=$(gh api "repos/${REPO}/pulls/1")
          test "$(jq -r .draft <<<"$pr")" = true
          test "$(jq -r .merged <<<"$pr")" = false
          test "$(jq -r .head.sha <<<"$pr")" = "$(git rev-parse HEAD)"

      - name: Converge schema and idempotency
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          for pair in \
            'fix(store): verify critical unique index contracts|Apply missing Schema contract checkpoint' \
            'fix(gateway): keep session creation idempotency authoritative|Apply missing authoritative idempotency checkpoint'
          do
            message=${pair%%|*}; step=${pair#*|}
            if has_commit "$message"; then ensure_checkpoint_ci "$message"; else run_supervisor_step "$step"; fi
          done

      - name: Converge durable Session control recovery
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          message='fix(relay): recover pending session controls'
          if has_commit "$message"; then ensure_checkpoint_ci "$message"; exit 0; fi
          extract_step orchestrate-session-control-recovery.yml 'Implement durable session-control recovery' /tmp/apply-session-control.sh
          /tmp/apply-session-control.sh
          python3 <<'PY'
          from pathlib import Path

          path = Path('platform/internal/harness/store/session_delivery_test.go')
          text = path.read_text()
          old = '''\t\tvalue.Status = status
          \t\tif status == domain.SessionStatusClosed {
          \t\t\tclosed := now
          \t\t\tvalue.ClosedAt = &closed
          \t\t}
          \t\tif err := persistence.CreateSession(t.Context(), value); err != nil {
          \t\t\tt.Fatalf("CreateSession: %v", err)
          \t\t}
          \t\treturn value
'''
          new = '''\t\tvalue.Status = domain.SessionStatusCreating
          \t\tif err := persistence.CreateSession(t.Context(), value); err != nil {
          \t\t\tt.Fatalf("CreateSession: %v", err)
          \t\t}
          \t\tupdates := map[string]any{"status": string(status), "updated_at": now.Add(time.Second)}
          \t\tif status == domain.SessionStatusClosed {
          \t\t\tupdates["closed_at"] = now.Add(time.Second)
          \t\t}
          \t\tif err := persistence.db.Model(new(sessionRow)).Where("id = ?", value.ID.String()).Updates(updates).Error; err != nil {
          \t\t\tt.Fatalf("set session status %s: %v", status, err)
          \t\t}
          \t\tvalue.Status = status
          \t\treturn value
'''
          if old not in text:
              raise SystemExit('session delivery state fixture anchor changed')
          path.write_text(text.replace(old, new))

          rust = Path('aba/src/gateway/control.rs')
          source = rust.read_text()
          cursor = 0
          edits = []
          while True:
              start = source.find('LocalSession {', cursor)
              if start < 0:
                  break
              brace = source.find('{', start)
              depth = 0
              index = brace
              in_string = False
              escaped = False
              while index < len(source):
                  ch = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              break
                  index += 1
              block = source[start:index + 1]
              if 'runtime_profile_id:' not in block:
                  line_start = source.rfind('\n', 0, index) + 1
                  closing_indent = source[line_start:index]
                  field_indent = closing_indent + '    '
                  addition = (
                      f'{field_indent}runtime_profile_id: "test-agent".to_owned(),\n'
                      f'{field_indent}workspace_id: "fixture".to_owned(),\n'
                      f'{field_indent}negotiated_capabilities: vec!["prompt".to_owned()],\n'
                      f'{field_indent}key_package_payload: Vec::new(),\n'
                  )
                  edits.append((index, addition))
              cursor = index + 1
          for index, addition in reversed(edits):
              source = source[:index] + addition + source[index:]
          rust.write_text(source)
          print(f'completed {len(edits)} LocalSession literals')
          PY
          gofmt -w platform/internal/harness/gateway/*.go platform/internal/harness/store/session_delivery*.go
          cargo fmt --manifest-path aba/Cargo.toml --all
          git diff --check
          (cd platform && go test -count=1 ./internal/harness/store ./internal/harness/gateway && go test -race -count=1 ./internal/harness/store ./internal/harness/gateway && go test -count=1 ./... && go vet ./...)
          (cd aba && cargo fmt --all -- --check && cargo clippy --locked --workspace --all-targets --all-features -- -D warnings && cargo test --locked --workspace --all-targets)
          (cd hc && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build)
          commit_checkpoint "$message"

      - name: Converge source-aware HC encrypted Outbox
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          message='fix(hc): persist encrypted outbox and scoped sequences'
          if has_commit "$message"; then ensure_checkpoint_ci "$message"; exit 0; fi
          require_source
          git show "origin/${SOURCE_BRANCH}:.github/workflows/orchestrate-hc-outbox-repair.yml" > /tmp/hc.yml
          python3 <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/hc.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = lines[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          python = '\n'.join(line[indent:] for line in body) + '\n'
          segment = python.index('# ABA uses the same peer-control contract')
          Path('/tmp/apply-hc-nonplatform.py').write_text('from pathlib import Path\n' + python[segment:])

          path = Path('platform/internal/harness/gateway/connection_directory.go')
          text = path.read_text()
          text, count = re.subn(
              r'\n\s*inboundControlSequence\s+atomic\.Uint64\n',
              '\n\tinboundControlMu        sync.Mutex\n\tinboundControlSequences map[[16]byte]uint64\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('inbound sequence field anchor changed')
          begin = text.index('func newActiveConnection(')
          end_constructor = text.index('\n}', begin) + 2
          constructor = text[begin:end_constructor]
          if 'inboundControlSequences:' not in constructor:
              constructor, count = re.subn(
                  r'(done:\s*make\(chan struct\{\}\),)',
                  r'\1\n\t\tinboundControlSequences: make(map[[16]byte]uint64),',
                  constructor,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('active connection constructor anchor changed')
              text = text[:begin] + constructor + text[end_constructor:]
          method_start = text.index('func (connection *activeConnection) acceptInboundControlSequence(')
          method_end = text.index('\nfunc (connection *activeConnection) close(', method_start)
          method = r'''func (connection *activeConnection) acceptInboundControlSequence(receiver []byte, sequence uint64) bool {
	if len(receiver) != 16 || sequence == 0 {
		return false
	}
	var scope [16]byte
	copy(scope[:], receiver)
	connection.inboundControlMu.Lock()
	defer connection.inboundControlMu.Unlock()
	current, exists := connection.inboundControlSequences[scope]
	if exists && sequence <= current {
		return false
	}
	connection.inboundControlSequences[scope] = sequence
	return true
}
'''
          path.write_text(text[:method_start] + method + text[method_end:])

          ready = Path('platform/internal/harness/gateway/ready_packet.go')
          text = ready.read_text()
          old = '!connection.acceptInboundControlSequence(control.GetControlSequence())'
          if text.count(old) != 1:
              raise SystemExit('ready sequence call anchor changed')
          ready.write_text(text.replace(old, '!connection.acceptInboundControlSequence(control.GetReceiverEndpointId(), control.GetControlSequence())'))

          test = Path('platform/internal/harness/gateway/connection_directory_test.go')
          text = test.read_text()
          pattern = re.compile(r'func TestConnectionRejectsInboundControlReplayAndGap\(t \*testing\.T\) \{.*?\n\}', re.S)
          replacement = r'''func TestConnectionRejectsInboundControlReplayAndAllowsMonotonicAdvance(t *testing.T) {
	connection := newActiveConnection(domain.ID{3}, 1, [16]byte{1}, [32]byte{}, nil)
	receiver := make([]byte, 16)
	if !connection.acceptInboundControlSequence(receiver, 1) {
		t.Fatal("first inbound control sequence was rejected")
	}
	if connection.acceptInboundControlSequence(receiver, 1) {
		t.Fatal("inbound control replay was accepted")
	}
	if !connection.acceptInboundControlSequence(receiver, 3) {
		t.Fatal("strictly newer sequence gap was rejected")
	}
	if connection.acceptInboundControlSequence(receiver, 2) {
		t.Fatal("inbound sequence rollback was accepted")
	}
	if !connection.acceptInboundControlSequence(receiver, 4) {
		t.Fatal("next monotonic sequence was rejected")
	}
}'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('legacy sequence test anchor changed')
          text += r'''

func TestConnectionScopesInboundControlSequenceByReceiver(t *testing.T) {
	connection := newActiveConnection(domain.ID{4}, 1, [16]byte{1}, [32]byte{}, nil)
	platform := make([]byte, 16)
	peer := make([]byte, 16)
	peer[0] = 9
	if !connection.acceptInboundControlSequence(platform, 7) || !connection.acceptInboundControlSequence(peer, 31) {
		t.Fatal("independent receiver scopes were rejected")
	}
	if connection.acceptInboundControlSequence(platform, 7) || connection.acceptInboundControlSequence(peer, 30) {
		t.Fatal("scoped replay or rollback was accepted")
	}
	if !connection.acceptInboundControlSequence(platform, 9) || !connection.acceptInboundControlSequence(peer, 40) {
		t.Fatal("strictly newer scoped sequence was rejected")
	}
}
'''
          test.write_text(text)
          PY
          python3 /tmp/apply-hc-nonplatform.py
          extract_step orchestrate-hc-outbox-repair.yml 'Add HC outbox tests' /tmp/add-hc-tests.sh
          /tmp/add-hc-tests.sh
          python3 <<'PY'
          from pathlib import Path

          session = Path('hc/web/src/SessionSetup.tsx')
          text = session.read_text()
          text = text.replace(
              '[connection, identity, registration.endpointId, session]);',
              '[connection, identity, registration.endpointId, secureStore, session]);',
              1,
          )
          old = '''      if (acknowledgment !== null) {
        if (secureStore === null) {
'''
          new = '''      if (acknowledgment !== null) {
        if (openedPackage.current === null || acknowledgment.keyGeneration !== openedPackage.current.material.generation) {
          throw new Error('ABA acknowledgment key generation is invalid');
        }
        if (secureStore === null) {
'''
          if text.count(old) != 1:
              raise SystemExit('SessionSetup ACK generation anchor changed')
          session.write_text(text.replace(old, new))

          store = Path('hc/packages/core/src/secure-store.ts')
          text = store.read_text()
          anchor = '''    if (highestContiguousSequence < 0n || ranges.length > 32) {
      throw new Error('HC outbox acknowledgment is invalid');
    }
    const database = await this.open();
'''
          replacement = '''    if (highestContiguousSequence < 0n || ranges.length > 32) {
      throw new Error('HC outbox acknowledgment is invalid');
    }
    let previous = highestContiguousSequence;
    for (const range of ranges) {
      if (range.start <= previous || range.start > range.end) {
        throw new Error('HC outbox acknowledgment range is invalid');
      }
      previous = range.end;
    }
    const database = await this.open();
'''
          if text.count(anchor) != 1:
              raise SystemExit('HC outbox ACK range anchor changed')
          store.write_text(text.replace(anchor, replacement))
          PY
          cat >> hc/packages/core/src/secure-store.test.ts <<'TS'

it('rejects overlapping or rolled-back outbound acknowledgment ranges', async () => {
  const store = new IndexedDbSecureStore(indexedDB, `hc-outbox-ranges-${crypto.randomUUID()}`);
  const sessionId = '22'.repeat(16);
  await expect(store.acknowledgeOutboundFrames(sessionId, 3n, [{ start: 3n, end: 4n }])).rejects.toThrow(
    'HC outbox acknowledgment range is invalid',
  );
  await expect(store.acknowledgeOutboundFrames(sessionId, 0n, [{ start: 5n, end: 4n }])).rejects.toThrow(
    'HC outbox acknowledgment range is invalid',
  );
});
TS
          gofmt -w platform/internal/harness/gateway/connection_directory.go platform/internal/harness/gateway/connection_directory_test.go platform/internal/harness/gateway/ready_packet.go
          cargo fmt --manifest-path aba/Cargo.toml --all
          git diff --check
          (cd platform && go test -count=1 ./internal/harness/gateway && go test -race -count=1 ./internal/harness/gateway && go test -count=1 ./... && go vet ./...)
          (cd aba && cargo fmt --all -- --check && cargo clippy --locked --workspace --all-targets --all-features -- -D warnings && cargo test --locked --workspace --all-targets)
          (cd hc && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build)
          commit_checkpoint "$message"

      - name: Converge signed stale-session isolation
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          message='fix(relay): isolate stale sessions and durable replay'
          if has_commit "$message"; then ensure_checkpoint_ci "$message"; exit 0; fi
          extract_step orchestrate-replay-isolation-repair.yml 'Isolate unknown sessions and permit durable replay' /tmp/apply-isolation.sh
          /tmp/apply-isolation.sh
          if ! grep -q 'export async function openABAUncertainErrorPacket' hc/packages/core/src/frame.ts; then
            cat >> hc/packages/core/src/frame.ts <<'TS'

/** Compatibility alias for consumers that only handle the UNCERTAIN contract. */
export async function openABAUncertainErrorPacket(
  abaSigningPublicJwk: P256PublicJwk,
  encoded: Uint8Array,
): Promise<{ readonly code: ErrorCode; readonly relatedMessageId: Uint8Array } | null> {
  return openABASessionErrorPacket(abaSigningPublicJwk, encoded);
}
TS
          fi
          gofmt -w platform/internal/harness/gateway/error_frame.go
          cargo fmt --manifest-path aba/Cargo.toml --all
          git diff --check
          (cd platform && go test -count=1 ./internal/harness/gateway && go test -race -count=1 ./internal/harness/gateway && go test -count=1 ./... && go vet ./...)
          (cd aba && cargo fmt --all -- --check && cargo clippy --locked --workspace --all-targets --all-features -- -D warnings && cargo test --locked --workspace --all-targets)
          (cd hc && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build)
          commit_checkpoint "$message"

      - name: Converge backpressure delayed replay and WAITING_KEY
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          for pair in \
            'fix(gateway): reconnect on outbound backpressure|Apply missing backpressure checkpoint' \
            'fix(aba): accept delayed platform frame replay|Apply missing delayed replay checkpoint' \
            'fix(relay): recover waiting key sessions from either endpoint|Apply missing WAITING_KEY recovery checkpoint'
          do
            message=${pair%%|*}; step=${pair#*|}
            if has_commit "$message"; then ensure_checkpoint_ci "$message"; else run_supervisor_step "$step"; fi
          done

      - name: Converge ABA process incarnation
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          message='fix(relay): fence ABA process incarnation changes'
          if has_commit "$message"; then ensure_checkpoint_ci "$message"; exit 0; fi
          require_source
          extract_local_step /tmp/v4.yml 'Complete ABA process-incarnation fencing' /tmp/process.sh
          /tmp/process.sh

      - name: Converge signature-gated inbound control sequence
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          message='fix(gateway): commit inbound control sequence after signature'
          if has_commit "$message"; then ensure_checkpoint_ci "$message"; exit 0; fi
          require_source
          extract_local_step /tmp/v4.yml 'Commit inbound control sequence only after signature' /tmp/sequence.sh
          /tmp/sequence.sh

      - name: Verify complete business chain
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          required=(
            'fix(gateway): fence replaced connections and preserve control sequence'
            'fix(relay): authorize encrypted frame persistence atomically'
            'fix(store): verify critical unique index contracts'
            'fix(gateway): keep session creation idempotency authoritative'
            'fix(relay): recover pending session controls'
            'fix(hc): persist encrypted outbox and scoped sequences'
            'fix(relay): isolate stale sessions and durable replay'
            'fix(gateway): reconnect on outbound backpressure'
            'fix(aba): accept delayed platform frame replay'
            'fix(relay): recover waiting key sessions from either endpoint'
            'fix(relay): fence ABA process incarnation changes'
            'fix(gateway): commit inbound control sequence after signature'
          )
          : > /tmp/review-repair-chain.tsv
          for message in "${required[@]}"; do
            sha=$(checkpoint_sha "$message")
            [[ -n "$sha" ]] || { echo "missing checkpoint: $message" >&2; exit 1; }
            wait_ci "$sha"
            printf '%s\t%s\n' "$sha" "$message" >> /tmp/review-repair-chain.tsv
          done

      - name: Remove temporary target workflows
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          rm -f .github/workflows/export-review-worktree.yml .github/workflows/apply-schema-contract-repair.yml
          if git status --porcelain -- .github/workflows | grep -q .; then
            commit_checkpoint 'chore(ci): remove temporary review workflows'
          fi
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run full clean verification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          ./scripts/check-docs.sh
          ./scripts/verify-platform-import.sh
          ./scripts/check-protocol.sh
          bash -n deploy/run-local-mvp.sh
          (cd platform && go test -count=1 ./... && go vet ./... && go test -race -count=1 ./internal/harness/gateway ./internal/harness/store ./internal/modules/harness)
          (cd platform/web && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build)
          (cd hc && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build)
          (cd aba && cargo metadata --locked --format-version 1 --no-deps >/dev/null && cargo fmt --all -- --check && cargo clippy --locked --workspace --all-targets --all-features -- -D warnings && cargo test --locked --workspace --all-targets)
          if command -v mss >/dev/null 2>&1; then
            mss doctor --strict
            mss verify --all
            mss upgrade admin v1.3.7 --format json > /tmp/mss-upgrade.json
            jq -e '.dryRun == true and .success == true and (.conflicts | length) == 0' /tmp/mss-upgrade.json >/dev/null
            echo passed > /tmp/mss-status
          else
            echo unavailable > /tmp/mss-status
          fi

      - name: Write and commit exact review report
        shell: bash
        run: |
          source /tmp/repair-lib.sh
          : > /tmp/review-repair-evidence.tsv
          while IFS=$'\t' read -r sha message; do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
            push_id=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].id' <<<"$runs")
            pr_id=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].id' <<<"$runs")
            printf '%s\t%s\t%s\t%s\n' "$sha" "$push_id" "$pr_id" "$message" >> /tmp/review-repair-evidence.tsv
          done < /tmp/review-repair-chain.tsv
          base_sha=$(gh api "repos/${REPO}/pulls/1" --jq .base.sha)
          mss_status=$(cat /tmp/mss-status)
          mkdir -p docs/roadmap/verification
          {
            echo '# PR #1 Review 修复验证'
            echo
            echo '- 日期：2026-09-05'
            echo "- 仓库：\`${REPO}\`"
            echo "- 分支：\`${TARGET_BRANCH}\`"
            echo "- 验证实现 SHA：\`${IMPLEMENTATION_SHA}\`"
            echo "- Base SHA：\`${base_sha}\`"
            echo "- 收敛 Run：\`${GITHUB_RUN_ID}\`"
            echo "- mss 验证：\`${mss_status}\`"
            echo
            echo '## 检查点与 CI'
            echo
            echo '| SHA | 单一职责 | Push CI | PR CI |'
            echo '| --- | --- | ---: | ---: |'
            while IFS=$'\t' read -r sha push_id pr_id message; do
              echo "| \`${sha}\` | ${message} | \`${push_id}\` success | \`${pr_id}\` success |"
            done < /tmp/review-repair-evidence.tsv
            echo
            echo '## 已关闭问题'
            echo
            echo '- 连接替换 Fencing、失败不烧号和签名验证后提交入站 Control Sequence。'
            echo '- EncryptedFrame 身份、状态、Credential、Generation 与 owner/tenant 原子授权写入。'
            echo '- 安全关键唯一索引精确验证及首发 Flags 严格为零。'
            echo '- Session 创建幂等权威结果、控制恢复和待确认 Key Package 幂等重发。'
            echo '- HC IndexedDB 加密 Outbox、ABA 签名 ACK、Generation/Range 校验和原字节重连重发。'
            echo '- 未知 Session 签名终态、延迟原密文投递、Backpressure 恢复和 ABA Process Incarnation Fencing。'
            echo
            echo '## 本 SHA 实际通过'
            echo
            echo '文档、Thin Host import、Protocol、Go 全量/Vet/Race、Admin Web lint/test/build、HC lint/typecheck/test/build、Rust metadata/fmt/Clippy/test，以及 Launcher shell 语法检查。'
            echo
            echo '## 未执行及 Draft 门禁'
            echo
            echo '- 本轮 Head 的真实内置浏览器四进程 E2E 未重新执行；原 MVP 浏览器证据不能自动继承。'
            echo '- 未执行生产 KMS/OS Keyring、TLS/WSS、外部数据库、跨实例 Ownership/Kick、1,000 WSS/100 Session、磁盘满、长稳和生产部署。'
            echo '- 固定 Admin Web v1.3.7 的已记录供应链风险仍未由上游安全版本关闭。'
            echo '- PR 保持 Draft、未合并。'
            echo
            echo '## 安全边界'
            echo
            echo '没有引入任意远程命令入口；真实 command、args、env 和 Workspace path 继续只来自 ABA 本地配置。'
          } > docs/roadmap/verification/2026-09-05-review-repairs.md
          if ! grep -q 'Draft PR #1 Review 修复闭环' docs/memory/work-log.md; then
            cat >> docs/memory/work-log.md <<EOF

          ## 2026-09-05 — Draft PR #1 Review 修复闭环

          - 通过独立 fast-forward 提交修复 Connection Fencing、Frame 原子授权、关键唯一索引、Session 幂等、控制恢复、HC 加密 Outbox、控制序列、未知 Session、延迟重放、背压和 ABA Process Incarnation。
          - 每个检查点绑定该 SHA 的 push 与 pull_request CI 同时成功后才进入下一项。
          - 最终实现验证 SHA：\`${IMPLEMENTATION_SHA}\`；证据见 \`docs/roadmap/verification/2026-09-05-review-repairs.md\`。
          - PR 保持 Draft、未合并；未把浏览器或生产验证写成通过。
          EOF
          fi
          git diff --check
          commit_checkpoint 'docs: finalize PR review repair verification'
          echo "REPORT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update Draft PR and remove temporary branches
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${REPORT_SHA}&per_page=100")
          push_run=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].id' <<<"$runs")
          pr_run=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].id' <<<"$runs")
          cat > /tmp/pr-body.md <<EOF
          ## 状态

          当前 Head：\`${REPORT_SHA}\`。本 PR 保持 **Draft**，未合并。

          - push CI \`${push_run}\`: success
          - PR CI \`${pr_run}\`: success
          - Review 修复报告：\`docs/roadmap/verification/2026-09-05-review-repairs.md\`

          ## 已修复

          - Connection Fencing、原子 Frame 授权与安全关键唯一索引。
          - Session 幂等、重连控制恢复和待确认 Key Package 重发。
          - HC 加密 Outbox、ABA 签名 ACK、Generation/Range 校验和原字节恢复。
          - Control Sequence 接收方作用域及签名后提交。
          - 未知 Session 隔离、延迟原密文投递、Backpressure 和 ABA Process Incarnation。

          ## Draft 门禁

          本轮 Head 的真实浏览器四进程 E2E、生产 KMS/TLS/外部数据库/跨实例/容量/长稳验证未重新完成；固定 Admin Web v1.3.7 的供应链风险仍未关闭。
          EOF
          gh pr edit 1 --repo "$REPO" --body-file /tmp/pr-body.md
          pr=$(gh api "repos/${REPO}/pulls/1")
          test "$(jq -r .draft <<<"$pr")" = true
          test "$(jq -r .merged <<<"$pr")" = false
          test "$(jq -r .head.sha <<<"$pr")" = "$REPORT_SHA"
          gh pr comment 1 --repo "$REPO" --body "Convergence Review repair closure passed at \`${REPORT_SHA}\`; push CI \`${push_run}\`, PR CI \`${pr_run}\`. PR remains Draft and unmerged."
          git push origin --delete "$SOURCE_BRANCH" || true
          git push origin --delete "$WATCHDOG_BRANCH" || true
          git push origin --delete "$CONVERGER_BRANCH" || true
