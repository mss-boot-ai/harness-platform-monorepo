name: Apply Review Reliability Group 2

on:
  push:
    branches:
      - codex/bootstrap-harness-platform-foundation
    paths:
      - .github/workflows/apply-review-reliability-group2.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'fix(ci): quote durable control workflow condition'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Guard reviewed ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 73cc5d24b2453a61239ce2b5ecde9dc98d75b2c5 HEAD
          for part in .review-fix/group2.part00 .review-fix/group2.part01 .review-fix/group2.part02 .review-fix/group2.part03 .review-fix/group2.part04; do
            test -s "$part"
          done
          test -z "$(git status --porcelain)"
      - name: Apply reviewed durable-control files
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .review-fix/group2.part* > "$RUNNER_TEMP/group2.b64"
          base64 --decode "$RUNNER_TEMP/group2.b64" > "$RUNNER_TEMP/group2.tar.gz"
          printf '%s  %s\n' '66dfb4b3264d9aec314dc58554c45f45c1304e2b2d7061956fb2487e4d62b1d9' "$RUNNER_TEMP/group2.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/group2.tar.gz" -C "$GITHUB_WORKSPACE"
          gofmt -w \
            platform/internal/harness/gateway/control_outbox.go \
            platform/internal/harness/gateway/control_outbox_test.go \
            platform/internal/harness/gateway/ready_packet.go \
            platform/internal/harness/gateway/server.go \
            platform/internal/harness/gateway/session.go \
            platform/internal/harness/gateway/session_close.go \
            platform/internal/harness/gateway/session_outbox_test.go \
            platform/internal/harness/gateway/websocket.go \
            platform/internal/harness/store/control_outbox_test.go \
            platform/internal/harness/store/session_close.go \
            platform/internal/harness/store/session_create.go \
            platform/internal/harness/store/session_create_test.go \
            platform/internal/harness/store/session_outbox_test.go
          git diff --check
      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - name: Verify durable-control checkpoint before commit
        working-directory: platform
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -count=1 ./internal/harness/store ./internal/harness/gateway
          go test -race -count=1 ./internal/harness/store ./internal/harness/gateway
          go vet ./...
      - name: Commit and push durable-control checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git rm .github/workflows/apply-review-reliability-group2.yml
          git rm .github/workflows/apply-schema-contract-repair.yml
          git rm .review-fix/group2.part00 .review-fix/group2.part01 .review-fix/group2.part02 .review-fix/group2.part03 .review-fix/group2.part04
          git add -A platform/internal/harness/gateway platform/internal/harness/store
          git diff --cached --check
          git commit -m 'fix(relay): persist control delivery and stabilize session idempotency [skip ci]'
          git push origin HEAD:codex/bootstrap-harness-platform-foundation

# Condition is deliberately quoted to avoid YAML scalar ambiguity.
