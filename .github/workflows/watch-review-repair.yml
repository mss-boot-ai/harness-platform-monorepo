name: Watch Review Repair Closure

on:
  push:
    branches:
      - codex/review-repair-watchdog-20260905

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  watch:
    if: github.event.head_commit.message == 'chore(ci): watch review repair closure'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TARGET_BRANCH: codex/bootstrap-harness-platform-foundation
      ORCHESTRATOR_BRANCH: codex/review-repair-orchestrator-20260905
      WATCHDOG_BRANCH: codex/review-repair-watchdog-20260905
      REPO: mss-boot-ai/harness-platform-monorepo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for corrected executor to stop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 500); do
            response=$(gh api "repos/${REPO}/actions/workflows/execute-review-repairs-v5.yml/runs?branch=${ORCHESTRATOR_BRANCH}&per_page=5" 2>/dev/null || echo '{"workflow_runs":[]}')
            run=$(jq -c '.workflow_runs[0] // {}' <<<"$response")
            status=$(jq -r '.status // ""' <<<"$run")
            if [[ "$status" == completed ]]; then
              echo "EXECUTOR_RUN=$(jq -r '.id' <<<"$run")" >> "$GITHUB_ENV"
              echo "EXECUTOR_URL=$(jq -r '.html_url' <<<"$run")" >> "$GITHUB_ENV"
              echo "EXECUTOR_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$run")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "corrected executor did not complete" >&2
          exit 1

      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Inspect required business chain
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'fix(gateway): fence replaced connections and preserve control sequence'
            'fix(relay): authorize encrypted frame persistence atomically'
            'fix(store): verify critical unique index contracts'
            'fix(gateway): keep session creation idempotency authoritative'
            'fix(relay): recover pending session controls'
            'fix(hc): persist encrypted outbox and scoped sequences'
            'fix(relay): isolate stale sessions and durable replay'
            'fix(gateway): reconnect on outbound backpressure'
            'fix(aba): accept delayed platform frame replay'
            'fix(relay): recover waiting key sessions from either endpoint'
            'fix(relay): fence ABA process incarnation changes'
            'fix(gateway): commit inbound control sequence after signature'
          )
          missing=''
          for message in "${required[@]}"; do
            if ! git log --format=%s | grep -Fxq "$message"; then
              missing="$message"
              break
            fi
          done
          if [[ -n "$missing" ]]; then
            gh run view "$EXECUTOR_RUN" --repo "$REPO" --log-failed > /tmp/failed.log 2>&1 || true
            tail -n 80 /tmp/failed.log | sed -E 's/(token|secret|authorization)[^ ]*/[redacted]/Ig' > /tmp/failed-tail.log
            {
              echo "Review repair executor \`${EXECUTOR_RUN}\` finished with \`${EXECUTOR_CONCLUSION}\`."
              echo
              echo "First missing checkpoint: \`${missing}\`."
              echo
              echo "Run: ${EXECUTOR_URL}"
              echo
              echo '<details><summary>Failed log tail</summary>'
              echo
              echo '```text'
              cat /tmp/failed-tail.log
              echo '```'
              echo '</details>'
              echo
              echo 'No PR merge or Draft-state change was made.'
            } > /tmp/failure-comment.md
            gh pr comment 1 --repo "$REPO" --body-file /tmp/failure-comment.md
            exit 1
          fi

      - name: Verify every business checkpoint CI
        shell: bash
        run: |
          set -euo pipefail
          messages=(
            'fix(gateway): fence replaced connections and preserve control sequence'
            'fix(relay): authorize encrypted frame persistence atomically'
            'fix(store): verify critical unique index contracts'
            'fix(gateway): keep session creation idempotency authoritative'
            'fix(relay): recover pending session controls'
            'fix(hc): persist encrypted outbox and scoped sequences'
            'fix(relay): isolate stale sessions and durable replay'
            'fix(gateway): reconnect on outbound backpressure'
            'fix(aba): accept delayed platform frame replay'
            'fix(relay): recover waiting key sessions from either endpoint'
            'fix(relay): fence ABA process incarnation changes'
            'fix(gateway): commit inbound control sequence after signature'
          )
          for message in "${messages[@]}"; do
            sha=$(git log --format='%H%x09%s' | awk -F '\t' -v wanted="$message" '$2 == wanted {print $1; exit}')
            for attempt in $(seq 1 200); do
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
              push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
              pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
              if [[ "$push" == success && "$pr" == success ]]; then break; fi
              if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then
                echo "checkpoint CI failed: ${sha} push=${push} pr=${pr}" >&2
                exit 1
              fi
              sleep 15
            done
          done

      - name: Publish existing closure when report is ready
        shell: bash
        run: |
          set -euo pipefail
          report_sha=$(git log --format='%H%x09%s' | awk -F '\t' '$2 == "docs: finalize PR review repair verification" {print $1; exit}')
          if [[ -z "$report_sha" || ! -f docs/roadmap/verification/2026-09-05-review-repairs.md ]]; then
            gh pr comment 1 --repo "$REPO" --body "All Review business checkpoints exist and have successful CI, but the durable final report is not yet present. Executor: \`${EXECUTOR_RUN}\` / \`${EXECUTOR_CONCLUSION}\`. The separate finalizer remains responsible for report publication; PR stays Draft."
            exit 0
          fi
          for attempt in $(seq 1 200); do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${report_sha}&per_page=100")
            push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
            pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
            if [[ "$push" == success && "$pr" == success ]]; then
              push_run=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].id' <<<"$runs")
              pr_run=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].id' <<<"$runs")
              break
            fi
            if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then exit 1; fi
            sleep 15
          done
          current=$(git rev-parse HEAD)
          if [[ "$current" != "$report_sha" ]]; then
            report_sha="$current"
          fi
          cat > /tmp/pr-body.md <<EOF
          ## 状态

          当前 Head：\`${report_sha}\`。本 PR 保持 **Draft**，未合并。

          - push CI \`${push_run}\`: success
          - PR CI \`${pr_run}\`: success
          - Review 修复报告：\`docs/roadmap/verification/2026-09-05-review-repairs.md\`
          - 原本地 MVP 报告：\`docs/roadmap/verification/2026-09-05-mvp-final.md\`

          ## 已修复

          - 连接替换 Fencing、Frame 原子授权和失败不烧号的控制序列。
          - Session 幂等结果、重连控制恢复和待确认 Key Package 重发。
          - HC 加密 Outbox、ABA 签名 ACK 与原字节重连重发。
          - Control Sequence 接收方作用域及签名后提交。
          - 未知 Session 隔离、延迟原密文投递、Backpressure 恢复。
          - 安全关键唯一索引和 ABA Process Incarnation Fencing。

          ## Draft 门禁

          本轮 Head 的浏览器四进程 E2E、生产 KMS/TLS/外部数据库/跨实例/容量/长稳验证未重新完成；固定 Admin Web v1.3.7 的供应链风险仍未关闭。
          EOF
          gh pr edit 1 --repo "$REPO" --body-file /tmp/pr-body.md
          pr_state=$(gh api "repos/${REPO}/pulls/1")
          test "$(jq -r .draft <<<"$pr_state")" = true
          test "$(jq -r .merged <<<"$pr_state")" = false
          gh pr comment 1 --repo "$REPO" --body "Watchdog confirmed Review repair closure at \`${report_sha}\`; push CI \`${push_run}\`, PR CI \`${pr_run}\`. PR remains Draft and unmerged."

      - name: Delete watchdog branch after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$WATCHDOG_BRANCH"
