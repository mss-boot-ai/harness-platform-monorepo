name: Orchestrate Session Control Recovery

on:
  push:
    branches:
      - codex/review-repair-orchestrator-20260905

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(ci): orchestrate session control recovery'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: codex/bootstrap-harness-platform-foundation
      REPO: mss-boot-ai/harness-platform-monorepo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for authoritative idempotency checkpoint
        shell: bash
        run: |
          set -euo pipefail
          wanted='fix(gateway): keep session creation idempotency authoritative'
          for attempt in $(seq 1 100); do
            sha=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
            message=$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.message | split("\n")[0]')
            if [[ "$message" == "$wanted" ]]; then
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
              push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
              pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
              if [[ "$push" == success && "$pr" == success ]]; then
                echo "BASE_SHA=$sha" >> "$GITHUB_ENV"
                exit 0
              fi
              if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then
                echo "previous checkpoint CI failed: push=$push pr=$pr" >&2
                exit 1
              fi
            fi
            sleep 15
          done
          echo "previous checkpoint did not reach successful CI" >&2
          exit 1

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Implement durable session-control recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          server = Path('platform/internal/harness/gateway/server.go')
          text = server.read_text()
          anchor = '''\tGetSession(context.Context, domain.ID) (domain.Session, error)
          \tUpdateSession(context.Context, domain.ID, func(*domain.Session) error) (domain.Session, error)
          \tListEndpoints(context.Context, string, string, int) ([]domain.Endpoint, error)
'''
          replacement = '''\tGetSession(context.Context, domain.ID) (domain.Session, error)
          \tUpdateSession(context.Context, domain.ID, func(*domain.Session) error) (domain.Session, error)
          \tGetScopedEndpoint(context.Context, domain.ID, string, string) (domain.Endpoint, error)
          \tListSessionsForEndpointDelivery(context.Context, domain.Endpoint, []domain.SessionStatus, int) ([]domain.Session, error)
          \tListEndpoints(context.Context, string, string, int) ([]domain.Endpoint, error)
'''
          if text.count(anchor) != 1:
              raise SystemExit('gateway Persistence session anchor changed')
          server.write_text(text.replace(anchor, replacement))

          websocket = Path('platform/internal/harness/gateway/websocket.go')
          text = websocket.read_text()
          anchor = '''\tdefer server.connections.remove(active)
          \tdefer active.close(websocket.CloseNormalClosure, "connection closed")
          \tgo active.runWriter()
          \t_ = connection.SetReadDeadline(time.Now().Add(2 * time.Duration(heartbeatIntervalMS) * time.Millisecond))
'''
          replacement = '''\tdefer server.connections.remove(active)
          \tdefer active.close(websocket.CloseNormalClosure, "connection closed")
          \tgo active.runWriter()
          \tif err := server.recoverPendingSessionControls(request.Context(), endpoint); err != nil {
          \t\tactive.close(websocket.CloseInternalServerErr, "session recovery unavailable")
          \t\treturn
          \t}
          \t_ = connection.SetReadDeadline(time.Now().Add(2 * time.Duration(heartbeatIntervalMS) * time.Millisecond))
'''
          if text.count(anchor) != 1:
              raise SystemExit('websocket activation anchor changed')
          websocket.write_text(text.replace(anchor, replacement))

          ready = Path('platform/internal/harness/gateway/ready_packet.go')
          text = ready.read_text()
          old = '''\tif session.ABAEndpointID != endpoint.ID || session.HCEndpointID != receiverID ||
          \t\tsession.Status != domain.SessionStatusCreating || result.GetActiveKeyGeneration() != 0 ||
          \t\t!capabilitySubset(result.GetNegotiatedCapabilityHints(), session.RequestedCapabilities) {
          \t\treturn domain.ID{}, errors.New("OpenTunnelResult session binding is invalid")
          \t}
'''
          new = '''\tif session.ABAEndpointID != endpoint.ID || session.HCEndpointID != receiverID ||
          \t\t(session.Status != domain.SessionStatusCreating && session.Status != domain.SessionStatusWaitingKey) ||
          \t\tresult.GetActiveKeyGeneration() != 0 ||
          \t\t!capabilitySubset(result.GetNegotiatedCapabilityHints(), session.RequestedCapabilities) {
          \t\treturn domain.ID{}, errors.New("OpenTunnelResult session binding is invalid")
          \t}
'''
          if text.count(old) != 1:
              raise SystemExit('OpenTunnelResult state anchor changed')
          text = text.replace(old, new)
          old = '''\t\t_, err = server.persistence.UpdateSession(ctx, session.ID, func(value *domain.Session) error {
          \t\t\treturn value.WaitForKey(now)
          \t\t})
'''
          new = '''\t\tif session.Status == domain.SessionStatusCreating {
          \t\t\t_, err = server.persistence.UpdateSession(ctx, session.ID, func(value *domain.Session) error {
          \t\t\t\treturn value.WaitForKey(now)
          \t\t\t})
          \t\t}
'''
          if text.count(old) != 1:
              raise SystemExit('OpenTunnelResult transition anchor changed')
          ready.write_text(text.replace(old, new))

          Path('platform/internal/harness/store/session_delivery.go').write_text(r'''package store

import (
    "context"
    "strings"

    "github.com/mss-boot-ai/harness-platform-monorepo/platform/internal/harness/domain"
)

func (store *Store) GetScopedEndpoint(
    ctx context.Context,
    id domain.ID,
    owner string,
    tenant string,
) (domain.Endpoint, error) {
    if err := requireStore(store, ctx); err != nil {
        return domain.Endpoint{}, err
    }
    owner = strings.TrimSpace(owner)
    tenant = strings.TrimSpace(tenant)
    if id.IsZero() || owner == "" {
        return domain.Endpoint{}, domain.NewProblem(domain.CodeInvalidArgument, "endpoint scope is required", nil)
    }
    var row endpointRow
    if err := store.db.WithContext(ctx).Where(
        "id = ? AND owner_user_id = ? AND tenant_id = ?", id.String(), owner, tenant,
    ).First(&row).Error; err != nil {
        return domain.Endpoint{}, notFoundOr("read scoped endpoint", "endpoint was not found", err)
    }
    return endpointFromRow(row)
}

func (store *Store) ListSessionsForEndpointDelivery(
    ctx context.Context,
    endpoint domain.Endpoint,
    statuses []domain.SessionStatus,
    limit int,
) ([]domain.Session, error) {
    if err := requireStore(store, ctx); err != nil {
        return nil, err
    }
    if endpoint.ID.IsZero() || strings.TrimSpace(endpoint.OwnerUserID) == "" || limit <= 0 || limit > 256 || len(statuses) == 0 {
        return nil, domain.NewProblem(domain.CodeInvalidArgument, "session delivery scope is invalid", nil)
    }
    values := make([]string, 0, len(statuses))
    for _, status := range statuses {
        switch status {
        case domain.SessionStatusCreating, domain.SessionStatusWaitingKey, domain.SessionStatusClosed:
            values = append(values, string(status))
        default:
            return nil, domain.NewProblem(domain.CodeInvalidArgument, "session delivery status is invalid", nil)
        }
    }
    column := ""
    switch endpoint.Type {
    case domain.EndpointTypeABA:
        column = "aba_endpoint_id"
    case domain.EndpointTypeHCWeb, domain.EndpointTypeHCReference:
        column = "hc_endpoint_id"
    default:
        return nil, domain.NewProblem(domain.CodeInvalidArgument, "endpoint cannot receive session controls", nil)
    }
    var rows []sessionRow
    if err := store.db.WithContext(ctx).Where(
        column+" = ? AND owner_user_id = ? AND tenant_id = ? AND status IN ?",
        endpoint.ID.String(), strings.TrimSpace(endpoint.OwnerUserID), strings.TrimSpace(endpoint.TenantID), values,
    ).Order("updated_at ASC, id ASC").Limit(limit).Find(&rows).Error; err != nil {
        return nil, classifyPersistence(err, "list pending session controls")
    }
    sessions := make([]domain.Session, 0, len(rows))
    for _, row := range rows {
        session, err := sessionFromRow(row)
        if err != nil {
            return nil, err
        }
        sessions = append(sessions, session)
    }
    return sessions, nil
}
''')

          Path('platform/internal/harness/gateway/session_recovery.go').write_text(r'''package gateway

import (
    "context"

    "github.com/mss-boot-ai/harness-platform-monorepo/platform/internal/harness/domain"
)

const maxRecoveredSessionControls = 128

func (server *Server) recoverPendingSessionControls(ctx context.Context, endpoint domain.Endpoint) error {
    var statuses []domain.SessionStatus
    switch endpoint.Type {
    case domain.EndpointTypeABA:
        statuses = []domain.SessionStatus{domain.SessionStatusCreating, domain.SessionStatusClosed}
    case domain.EndpointTypeHCWeb, domain.EndpointTypeHCReference:
        statuses = []domain.SessionStatus{domain.SessionStatusWaitingKey}
    default:
        return nil
    }
    sessions, err := server.persistence.ListSessionsForEndpointDelivery(
        ctx, endpoint, statuses, maxRecoveredSessionControls,
    )
    if err != nil {
        return err
    }
    now := server.now().UTC()
    for _, session := range sessions {
        switch {
        case endpoint.Type == domain.EndpointTypeABA && session.Status == domain.SessionStatusCreating:
            hc, lookupErr := server.persistence.GetScopedEndpoint(
                ctx, session.HCEndpointID, session.OwnerUserID, session.TenantID,
            )
            if lookupErr == nil {
                _ = server.sendOpenTunnelRequest(session, hc, now)
            }
        case endpoint.Type == domain.EndpointTypeABA && session.Status == domain.SessionStatusClosed:
            _ = server.sendCloseTunnelRequest(session, now)
        case (endpoint.Type == domain.EndpointTypeHCWeb || endpoint.Type == domain.EndpointTypeHCReference) &&
            session.Status == domain.SessionStatusWaitingKey:
            _ = server.sendOpenTunnelRequest(session, endpoint, now)
        }
    }
    return nil
}
''')

