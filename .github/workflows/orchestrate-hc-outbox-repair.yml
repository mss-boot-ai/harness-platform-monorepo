it('persists outbound frames before send and removes them only after acknowledgment', async () => {
  const store = new IndexedDbSecureStore(indexedDB, `hc-outbox-${crypto.randomUUID()}`);
  const sessionId = '11'.repeat(16);
  expect(await store.nextOutboundFrameSequence(sessionId)).toBe(1n);
  await store.putOutboundFrame({ packet: new Uint8Array([1, 2, 3]), sequence: 1n, sessionId });
  expect(await store.nextOutboundFrameSequence(sessionId)).toBe(2n);
  await store.putOutboundFrame({ packet: new Uint8Array([4, 5, 6]), sequence: 2n, sessionId });
  expect((await store.listOutboundFrames(sessionId)).map((value) => value.sequence)).toEqual([1n, 2n]);
  await store.acknowledgeOutboundFrames(sessionId, 1n);
  expect((await store.listOutboundFrames(sessionId)).map((value) => value.sequence)).toEqual([2n]);
  await store.acknowledgeOutboundFrames(sessionId, 0n, [{ start: 2n, end: 2n }]);
  expect(await store.listOutboundFrames(sessionId)).toEqual([]);
});

it('persists independent monotonic control sequence scopes', async () => {
  const store = new IndexedDbSecureStore(indexedDB, `hc-control-${crypto.randomUUID()}`);
  expect(await store.nextControlSequence('platform')).toBe(1n);
  expect(await store.nextControlSequence('peer:abcdef')).toBe(1n);
  expect(await store.nextControlSequence('platform')).toBe(2n);
  expect(await store.nextControlSequence('peer:abcdef')).toBe(2n);
});
