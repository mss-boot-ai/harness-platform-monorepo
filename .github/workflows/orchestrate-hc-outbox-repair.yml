export interface VerifiedFrameAck {
  readonly highestContiguousSequence: bigint;
  readonly keyGeneration: bigint;
  readonly receivedRanges: readonly { readonly end: bigint; readonly start: bigint }[];
  readonly sessionId: string;
}

export async function openABAAckFramePacket(
  abaSigningPublicJwk: P256PublicJwk,
  binding: FrameBinding,
  encoded: Uint8Array,
): Promise<VerifiedFrameAck | null> {
  const packet = fromBinary(WirePacketSchema, encoded);
  if (packet.body.case !== 'ack') {
    return null;
  }
  if (packet.wireMajor !== 1 || packet.wireMinor !== 0 || packet.packetId.length !== 16) {
    throw new Error('ACK packet is invalid');
  }
  const frame = packet.body.value;
  const sessionId = decodeHexId(binding.sessionId);
  const abaEndpointId = decodeHexId(binding.abaEndpointId);
  const hcEndpointId = decodeHexId(binding.hcEndpointId);
  const channelId = await sessionChannelId(sessionId, abaEndpointId, hcEndpointId);
  const ranges = frame.receivedRanges.map((value) => ({ start: value.start, end: value.end }));
  if (
    frame.ackId.length !== 16 || frame.ackId.every((byte) => byte === 0) ||
    !equalBytes(frame.channelId, channelId) || !equalBytes(frame.sessionId, sessionId) ||
    !equalBytes(frame.endpointId, abaEndpointId) ||
    frame.acknowledgedDirection !== Direction.HC_TO_ABA ||
    frame.highestContiguousSequence <= 0n || frame.keyGeneration <= 0n ||
    frame.signature.length !== 64
  ) {
    throw new Error('ACK binding is invalid');
  }
  const transcript = buildAckTranscript({
    ackId: frame.ackId,
    acknowledgedDirection: frame.acknowledgedDirection,
    channelId: frame.channelId,
    createdAtMs: frame.createdAtMs,
    endpointId: frame.endpointId,
    highestContiguousSequence: frame.highestContiguousSequence,
    keyGeneration: frame.keyGeneration,
    receivedRanges: ranges,
    sessionId: frame.sessionId,
  });
  const key = await importP256VerifyingKey(abaSigningPublicJwk);
  if (!(await verifyP1363LowS(key, transcript, frame.signature))) {
    throw new Error('ACK signature is invalid');
  }
  return {
    highestContiguousSequence: frame.highestContiguousSequence,
    keyGeneration: frame.keyGeneration,
    receivedRanges: ranges,
    sessionId: binding.sessionId,
  };
}
