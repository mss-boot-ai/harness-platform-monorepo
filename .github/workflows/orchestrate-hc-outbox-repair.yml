name: Orchestrate HC Outbox Repair

on:
  push:
    branches:
      - codex/review-repair-orchestrator-20260905

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(ci): orchestrate HC outbox repair'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: codex/bootstrap-harness-platform-foundation
      REPO: mss-boot-ai/harness-platform-monorepo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for session-control recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          wanted='fix(relay): recover pending session controls'
          for attempt in $(seq 1 120); do
            sha=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
            message=$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.message | split("\n")[0]')
            if [[ "$message" == "$wanted" ]]; then
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
              push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
              pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
              if [[ "$push" == success && "$pr" == success ]]; then
                echo "BASE_SHA=$sha" >> "$GITHUB_ENV"
                exit 0
              fi
              if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then
                echo "previous checkpoint CI failed: push=$push pr=$pr" >&2
                exit 1
              fi
            fi
            sleep 15
          done
          echo "previous checkpoint did not reach successful CI" >&2
          exit 1

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Add persistent HC outbox and scoped control sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Platform control sequence is scoped by receiver and monotonic. This
          # separates Platform-local ResumeState from peer-directed controls.
          path = Path('platform/internal/harness/gateway/connection_directory.go')
          text = path.read_text()
          old = '''\tcontrolSequence        atomic.Uint64
          \tinboundControlSequence atomic.Uint64
          \tcloseOnce              sync.Once
'''
          new = '''\tcontrolSequence         atomic.Uint64
          \tinboundControlMu        sync.Mutex
          \tinboundControlSequences map[[16]byte]uint64
          \tcloseOnce               sync.Once
'''
          if text.count(old) != 1:
              raise SystemExit('activeConnection sequence fields changed')
          text = text.replace(old, new)
          old = '''\t\toutbound: make(chan []byte, maxInflightFrames), done: make(chan struct{}),
          \t}
'''
          new = '''\t\toutbound: make(chan []byte, maxInflightFrames), done: make(chan struct{}),
          \t\tinboundControlSequences: make(map[[16]byte]uint64),
          \t}
'''
          if text.count(old) != 1:
              raise SystemExit('activeConnection constructor anchor changed')
          text = text.replace(old, new)
          start = text.index('func (connection *activeConnection) acceptInboundControlSequence(')
          end = text.index('\nfunc (connection *activeConnection) close(', start)
          replacement = r'''func (connection *activeConnection) acceptInboundControlSequence(receiver []byte, sequence uint64) bool {
	if len(receiver) != 16 || sequence == 0 {
		return false
	}
	var scope [16]byte
	copy(scope[:], receiver)
	connection.inboundControlMu.Lock()
	defer connection.inboundControlMu.Unlock()
	current, exists := connection.inboundControlSequences[scope]
	if exists && sequence <= current {
		return false
	}
	connection.inboundControlSequences[scope] = sequence
	return true
}
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          ready = Path('platform/internal/harness/gateway/ready_packet.go')
          text = ready.read_text()
          old = '!connection.acceptInboundControlSequence(control.GetControlSequence())'
          new = '!connection.acceptInboundControlSequence(control.GetReceiverEndpointId(), control.GetControlSequence())'
          if text.count(old) != 1:
              raise SystemExit('ready control sequence call changed')
          ready.write_text(text.replace(old, new))

          test = Path('platform/internal/harness/gateway/connection_directory_test.go')
          text = test.read_text()
          text = text.replace('connection.acceptInboundControlSequence(1)', 'connection.acceptInboundControlSequence(make([]byte, 16), 1)')
          text = text.replace('connection.acceptInboundControlSequence(3)', 'connection.acceptInboundControlSequence(make([]byte, 16), 3)')
          text = text.replace('connection.acceptInboundControlSequence(2)', 'connection.acceptInboundControlSequence(make([]byte, 16), 2)')
          text += r'''

