  public async nextOutboundFrameSequence(sessionId: string): Promise<bigint> {
    validateSessionId(sessionId);
    const database = await this.open();
    try {
      const transaction = database.transaction(SEQUENCE_CURSOR_STORE, 'readonly');
      const current = await requestResult(
        transaction.objectStore(SEQUENCE_CURSOR_STORE).get(`frame:${sessionId}`) as IDBRequest<StoredSequenceCursor | undefined>,
      );
      await transactionComplete(transaction);
      return BigInt(current?.value ?? '0') + 1n;
    } finally {
      database.close();
    }
  }

  public async putOutboundFrame(frame: OutboxFrame): Promise<void> {
    validateSessionId(frame.sessionId);
    if (frame.sequence <= 0n || frame.packet.length === 0 || frame.packet.length > 1_048_576) {
      throw new Error('HC outbox frame is invalid');
    }
    const database = await this.open();
    const transaction = database.transaction([SESSION_OUTBOX_STORE, SEQUENCE_CURSOR_STORE], 'readwrite');
    try {
      const outbox = transaction.objectStore(SESSION_OUTBOX_STORE);
      const cursorStore = transaction.objectStore(SEQUENCE_CURSOR_STORE);
      const cursorId = `frame:${frame.sessionId}`;
      const current = await requestResult(cursorStore.get(cursorId) as IDBRequest<StoredSequenceCursor | undefined>);
      const expected = BigInt(current?.value ?? '0') + 1n;
      if (frame.sequence !== expected) {
        throw new Error('HC outbox sequence changed concurrently');
      }
      const count = await requestResult(outbox.count());
      if (count >= MAX_OUTBOX_FRAMES) {
        throw new Error('HC outbox capacity reached');
      }
      const id = outboxFrameId(frame.sessionId, frame.sequence);
      outbox.add({
        id,
        packet: frame.packet.slice(),
        sequence: frame.sequence.toString(),
        sessionId: frame.sessionId,
      } satisfies StoredOutboxFrame);
      cursorStore.put({ id: cursorId, value: frame.sequence.toString() } satisfies StoredSequenceCursor);
      await transactionComplete(transaction);
    } catch (error) {
      try {
        transaction.abort();
      } catch {
        // A completed transaction needs no rollback.
      }
      throw error;
    } finally {
      database.close();
    }
  }

  public async listOutboundFrames(sessionId: string): Promise<readonly OutboxFrame[]> {
    validateSessionId(sessionId);
    const database = await this.open();
    try {
      const transaction = database.transaction(SESSION_OUTBOX_STORE, 'readonly');
      const values = await requestResult(
        transaction.objectStore(SESSION_OUTBOX_STORE).index('sessionId').getAll(sessionId) as IDBRequest<StoredOutboxFrame[]>,
      );
      await transactionComplete(transaction);
      return values
        .map((value) => ({ packet: value.packet.slice(), sequence: BigInt(value.sequence), sessionId: value.sessionId }))
        .sort((left, right) => left.sequence < right.sequence ? -1 : left.sequence > right.sequence ? 1 : 0);
    } finally {
      database.close();
    }
  }

  public async acknowledgeOutboundFrames(
    sessionId: string,
    highestContiguousSequence: bigint,
    ranges: readonly { readonly end: bigint; readonly start: bigint }[] = [],
  ): Promise<void> {
    validateSessionId(sessionId);
    if (highestContiguousSequence < 0n || ranges.length > 32) {
      throw new Error('HC outbox acknowledgment is invalid');
    }
    const database = await this.open();
    const transaction = database.transaction(SESSION_OUTBOX_STORE, 'readwrite');
    try {
      const outbox = transaction.objectStore(SESSION_OUTBOX_STORE);
      const values = await requestResult(outbox.index('sessionId').getAll(sessionId) as IDBRequest<StoredOutboxFrame[]>);
      for (const value of values) {
        const sequence = BigInt(value.sequence);
        if (sequence <= highestContiguousSequence || ranges.some((range) => sequence >= range.start && sequence <= range.end)) {
          outbox.delete(value.id);
        }
      }
      await transactionComplete(transaction);
    } finally {
      database.close();
    }
  }

  public async nextControlSequence(scope: string): Promise<bigint> {
    if (!/^[a-z0-9:._-]{1,160}$/u.test(scope)) {
      throw new Error('HC control sequence scope is invalid');
    }
    const database = await this.open();
    const transaction = database.transaction(SEQUENCE_CURSOR_STORE, 'readwrite');
    try {
      const store = transaction.objectStore(SEQUENCE_CURSOR_STORE);
      const id = `control:${scope}`;
      const current = await requestResult(store.get(id) as IDBRequest<StoredSequenceCursor | undefined>);
      const next = BigInt(current?.value ?? '0') + 1n;
      store.put({ id, value: next.toString() } satisfies StoredSequenceCursor);
      await transactionComplete(transaction);
      return next;
    } finally {
      database.close();
    }
  }

  public async deleteSessionOutbox(sessionId: string): Promise<void> {
    validateSessionId(sessionId);
    const database = await this.open();
    const transaction = database.transaction([SESSION_OUTBOX_STORE, SEQUENCE_CURSOR_STORE], 'readwrite');
    try {
      const outbox = transaction.objectStore(SESSION_OUTBOX_STORE);
      const keys = await requestResult(outbox.index('sessionId').getAllKeys(sessionId));
      for (const key of keys) {
        outbox.delete(key);
      }
      transaction.objectStore(SEQUENCE_CURSOR_STORE).delete(`frame:${sessionId}`);
      await transactionComplete(transaction);
    } finally {
      database.close();
    }
  }
