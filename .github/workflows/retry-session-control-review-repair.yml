name: Retry Review Repair Safely

on:
  push:
    branches:
      - codex/review-repair-watchdog-20260905

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  retry:
    if: github.event.head_commit.message == 'chore(ci): retry review repair safely'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/bootstrap-harness-platform-foundation
      ORCHESTRATOR_BRANCH: codex/review-repair-orchestrator-20260905
      REPO: mss-boot-ai/harness-platform-monorepo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for source-aware executor
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 400); do
            response=$(gh api "repos/${REPO}/actions/workflows/execute-review-repairs-v7.yml/runs?branch=${ORCHESTRATOR_BRANCH}&per_page=5" 2>/dev/null || echo '{"workflow_runs":[]}')
            status=$(jq -r '.workflow_runs[0].status // ""' <<<"$response")
            if [[ "$status" == completed ]]; then
              echo "SOURCE_RUN=$(jq -r '.workflow_runs[0].id' <<<"$response")" >> "$GITHUB_ENV"
              echo "SOURCE_CONCLUSION=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$response")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Checkout target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: platform/go.mod

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Identify first missing checkpoint
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'fix(store): verify critical unique index contracts'
            'fix(gateway): keep session creation idempotency authoritative'
            'fix(relay): recover pending session controls'
            'fix(hc): persist encrypted outbox and scoped sequences'
            'fix(relay): isolate stale sessions and durable replay'
            'fix(gateway): reconnect on outbound backpressure'
            'fix(aba): accept delayed platform frame replay'
            'fix(relay): recover waiting key sessions from either endpoint'
            'fix(relay): fence ABA process incarnation changes'
            'fix(gateway): commit inbound control sequence after signature'
          )
          missing=''
          for message in "${required[@]}"; do
            if ! git log --format=%s | grep -Fxq "$message"; then missing="$message"; break; fi
          done
          echo "MISSING=${missing}" >> "$GITHUB_ENV"
          if [[ -z "$missing" ]]; then
            gh pr comment 1 --repo "$REPO" --body "Safe retry observed a complete Review business chain after source-aware Run \`${SOURCE_RUN}\` (\`${SOURCE_CONCLUSION}\`); no code was changed."
          fi

      - name: Repair Session Control construction if it is the first gap
        if: env.MISSING == 'fix(relay): recover pending session controls'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${ORCHESTRATOR_BRANCH}:refs/remotes/origin/${ORCHESTRATOR_BRANCH}"
          git show "origin/${ORCHESTRATOR_BRANCH}:.github/workflows/orchestrate-session-control-recovery.yml" > /tmp/session-control.yml
          python3 <<'PY'
          from pathlib import Path
          lines = Path('/tmp/session-control.yml').read_text().splitlines()
          marker = '- name: Implement durable session-control recovery'
          start = next(i for i, line in enumerate(lines) if line.strip() == marker)
          run = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |') + 1
          end = next(i for i in range(run, len(lines)) if lines[i].startswith('      - name: '))
          shell = lines[run:end]
          indent = min(len(line) - len(line.lstrip()) for line in shell if line.strip())
          Path('/tmp/apply-session-control.sh').write_text('\n'.join(line[indent:] for line in shell) + '\n')
          PY
          chmod +x /tmp/apply-session-control.sh
          /tmp/apply-session-control.sh
          python3 <<'PY'
          from pathlib import Path

          store_test = Path('platform/internal/harness/store/session_delivery_test.go')
          text = store_test.read_text()
          old = '''\t\tvalue.Status = status
          \t\tif status == domain.SessionStatusClosed {
          \t\t\tclosed := now
          \t\t\tvalue.ClosedAt = &closed
          \t\t}
          \t\tif err := persistence.CreateSession(t.Context(), value); err != nil {
          \t\t\tt.Fatalf("CreateSession: %v", err)
          \t\t}
          \t\treturn value
'''
          new = '''\t\tvalue.Status = domain.SessionStatusCreating
          \t\tif err := persistence.CreateSession(t.Context(), value); err != nil {
          \t\t\tt.Fatalf("CreateSession: %v", err)
          \t\t}
          \t\tupdates := map[string]any{"status": string(status), "updated_at": now.Add(time.Second)}
          \t\tif status == domain.SessionStatusClosed {
          \t\t\tupdates["closed_at"] = now.Add(time.Second)
          \t\t}
          \t\tif err := persistence.db.Model(new(sessionRow)).Where("id = ?", value.ID.String()).Updates(updates).Error; err != nil {
          \t\t\tt.Fatalf("set session status %s: %v", status, err)
          \t\t}
          \t\tvalue.Status = status
          \t\treturn value
'''
          if old not in text:
              raise SystemExit('session delivery test setup anchor changed')
          store_test.write_text(text.replace(old, new))

          rust = Path('aba/src/gateway/control.rs')
          source = rust.read_text()
          cursor = 0
          edits = []
          while True:
              start = source.find('LocalSession {', cursor)
              if start < 0:
                  break
              brace = source.find('{', start)
              depth = 0
              index = brace
              in_string = False
              escaped = False
              while index < len(source):
                  ch = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              break
                  index += 1
              block = source[start:index + 1]
              if 'runtime_profile_id:' not in block:
                  line_start = source.rfind('\n', 0, index) + 1
                  indent = source[line_start:index]
                  field_indent = indent + '    '
                  addition = (
                      f'{field_indent}runtime_profile_id: "test-agent".to_owned(),\n'
                      f'{field_indent}workspace_id: "fixture".to_owned(),\n'
                      f'{field_indent}negotiated_capabilities: vec!["prompt".to_owned()],\n'
                      f'{field_indent}key_package_payload: Vec::new(),\n'
                  )
                  edits.append((index, addition))
              cursor = index + 1
          for index, addition in reversed(edits):
              source = source[:index] + addition + source[index:]
          rust.write_text(source)
          print(f'completed {len(edits)} LocalSession test literals')
          PY
          gofmt -w platform/internal/harness/gateway/*.go platform/internal/harness/store/session_delivery*.go
          cargo fmt --manifest-path aba/Cargo.toml --all
          git diff --check
          (
            cd platform
            go test -count=1 ./internal/harness/store ./internal/harness/gateway
            go test -race -count=1 ./internal/harness/store ./internal/harness/gateway
            go test -count=1 ./...
            go vet ./...
          )
          (
            cd aba
            cargo fmt --all -- --check
            cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            cargo test --locked --workspace --all-targets
          )
          (
            cd hc
            corepack prepare pnpm@10.34.5 --activate
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm build
          )
          remote=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test "$remote" = "$(git rev-parse HEAD)"
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m 'fix(relay): recover pending session controls'
          sha=$(git rev-parse HEAD)
          git push origin "HEAD:${TARGET_BRANCH}"
          for attempt in $(seq 1 200); do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
            push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
            pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
            [[ "$push" == success && "$pr" == success ]] && break
            if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then exit 1; fi
            sleep 15
          done

      - name: Report non-Session-Control failure without guessing
        if: env.MISSING != '' && env.MISSING != 'fix(relay): recover pending session controls'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --repo "$REPO" --log-failed > /tmp/failure.log 2>&1 || true
          tail -n 100 /tmp/failure.log | sed -E 's/(token|secret|authorization)[^ ]*/[redacted]/Ig' > /tmp/failure-tail.log
          {
            echo "Source-aware Review repair Run \`${SOURCE_RUN}\` ended with \`${SOURCE_CONCLUSION}\`."
            echo
            echo "First missing checkpoint: \`${MISSING}\`."
            echo
            echo 'The safe retry did not guess a code change. Failed log tail:'
            echo
            echo '```text'
            cat /tmp/failure-tail.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 1 --repo "$REPO" --body-file /tmp/comment.md
          exit 1

      - name: Retrigger source-aware executor after repair
        if: env.MISSING == 'fix(relay): recover pending session controls'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$ORCHESTRATOR_BRANCH"
          git checkout -B "$ORCHESTRATOR_BRANCH" "origin/${ORCHESTRATOR_BRANCH}"
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git commit --allow-empty -m 'chore(ci): run source-aware review repairs'
          git push origin "HEAD:${ORCHESTRATOR_BRANCH}"
