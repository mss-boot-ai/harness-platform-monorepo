          if 'abaProcessIncarnations map[domain.ID][16]byte' not in text:
              anchor = '\ttrust       *TrustBundle\n\tconnections connectionDirectory\n}'
              if text.count(anchor) != 1:
                  raise SystemExit('Server field anchor changed')
              text = text.replace(anchor, '\ttrust                  *TrustBundle\n\tconnections            connectionDirectory\n\tprocessMu              sync.Mutex\n\tabaProcessIncarnations map[domain.ID][16]byte\n}')
          if 'abaProcessIncarnations: make(map[domain.ID][16]byte)' not in text:
              anchor = '\t\ttrust: config.Trust, connections: newMemoryConnectionDirectory(),\n\t}'
              if text.count(anchor) != 1:
                  raise SystemExit('Server constructor anchor changed')
              text = text.replace(anchor, '\t\ttrust: config.Trust, connections: newMemoryConnectionDirectory(),\n\t\tabaProcessIncarnations: make(map[domain.ID][16]byte),\n\t}')
