func TestFailSessionsForABAProcessRestartIsScopedAndTerminal(t *testing.T) {
	persistence := newTestStore(t)
	now := time.Unix(1_800_000_000, 0).UTC()
	aba := endpoint(151, 152, 153, domain.EndpointTypeABA, "owner", now)
	aba.TenantID = "tenant-a"
	hc := endpoint(154, 155, 156, domain.EndpointTypeHCWeb, "owner", now)
	hc.TenantID = "tenant-a"
	otherHC := endpoint(157, 158, 159, domain.EndpointTypeHCWeb, "owner", now)
	otherHC.TenantID = "tenant-b"
	for _, value := range []domain.Endpoint{aba, hc, otherHC} {
		if err := persistence.CreateEndpoint(t.Context(), value); err != nil {
			t.Fatalf("CreateEndpoint: %v", err)
		}
	}
	active := session(160, aba.ID, hc.ID, "owner", now)
	active.TenantID = "tenant-a"
	closed := session(161, aba.ID, hc.ID, "owner", now)
	closed.TenantID = "tenant-a"
	otherTenant := session(162, aba.ID, otherHC.ID, "owner", now)
	otherTenant.TenantID = "tenant-b"
	for _, value := range []domain.Session{active, closed, otherTenant} {
		if err := persistence.CreateSession(t.Context(), value); err != nil {
			t.Fatalf("CreateSession: %v", err)
		}
	}
	if err := persistence.db.Model(new(sessionRow)).Where("id = ?", active.ID.String()).Updates(map[string]any{
		"status": string(domain.SessionStatusActive), "current_key_generation": 1,
	}).Error; err != nil {
		t.Fatalf("activate session: %v", err)
	}
	if err := persistence.db.Model(new(sessionRow)).Where("id = ?", closed.ID.String()).Updates(map[string]any{
		"status": string(domain.SessionStatusClosed), "closed_at": now,
	}).Error; err != nil {
		t.Fatalf("close fixture session: %v", err)
	}
	if err := persistence.db.Model(new(sessionRow)).Where("id = ?", otherTenant.ID.String()).Updates(map[string]any{
		"status": string(domain.SessionStatusActive), "current_key_generation": 1,
	}).Error; err != nil {
		t.Fatalf("activate cross-tenant session: %v", err)
	}
	affected, err := persistence.FailSessionsForABAProcessRestart(t.Context(), aba, now.Add(time.Minute))
	if err != nil {
		t.Fatalf("FailSessionsForABAProcessRestart: %v", err)
	}
	if affected != 1 {
		t.Fatalf("affected=%d, want 1", affected)
	}
	updated, err := persistence.GetSession(t.Context(), active.ID)
	if err != nil || updated.Status != domain.SessionStatusFailed || updated.ClosedAt == nil {
		t.Fatalf("active session after restart=%#v error=%v", updated, err)
	}
	unchanged, _ := persistence.GetSession(t.Context(), closed.ID)
	if unchanged.Status != domain.SessionStatusClosed {
		t.Fatalf("closed session changed to %s", unchanged.Status)
	}
	crossTenant, _ := persistence.GetSession(t.Context(), otherTenant.ID)
	if crossTenant.Status != domain.SessionStatusActive {
		t.Fatalf("cross-tenant session changed to %s", crossTenant.Status)
	}
}
''')

