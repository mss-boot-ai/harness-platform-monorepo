name: Probe And Finalize Review Repairs

on:
  push:
    branches:
      - codex/review-repair-probe-20260905

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  probe:
    if: github.event.head_commit.message == 'chore(ci): probe and finalize review repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TARGET_BRANCH: codex/bootstrap-harness-platform-foundation
      CONVERGER_BRANCH: codex/review-repair-converger-20260905
      SOURCE_BRANCH: codex/review-repair-orchestrator-20260905
      WATCHDOG_BRANCH: codex/review-repair-watchdog-20260905
      PROBE_BRANCH: codex/review-repair-probe-20260905
      REPO: mss-boot-ai/harness-platform-monorepo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for convergence executor to stop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 520); do
            response=$(gh api "repos/${REPO}/actions/workflows/converge-review-repairs.yml/runs?branch=${CONVERGER_BRANCH}&per_page=5" 2>/dev/null || echo '{"workflow_runs":[]}')
            run=$(jq -c '.workflow_runs[0] // {}' <<<"$response")
            status=$(jq -r '.status // ""' <<<"$run")
            if [[ "$status" == completed ]]; then
              echo "CONVERGENCE_RUN=$(jq -r '.id' <<<"$run")" >> "$GITHUB_ENV"
              echo "CONVERGENCE_URL=$(jq -r '.html_url' <<<"$run")" >> "$GITHUB_ENV"
              echo "CONVERGENCE_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$run")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "convergence executor did not complete" >&2
          exit 1

      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: platform/go.mod
          cache: true
          cache-dependency-path: platform/go.sum

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Initialize helpers and inspect first gap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          cat > /tmp/repair-lib.sh <<'SH'
          set -euo pipefail
          has_commit() { git log --format=%s | grep -Fxq "$1"; }
          checkpoint_sha() { git log --format='%H%x09%s' | awk -F '\t' -v wanted="$1" '$2 == wanted {print $1; exit}'; }
          wait_ci() {
            local sha="$1"
            for attempt in $(seq 1 220); do
              local runs push pr
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100")
              push=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "push")][0].conclusion // ""' <<<"$runs")
              pr=$(jq -r '[.workflow_runs[] | select(.name == "Harness Platform CI" and .event == "pull_request")][0].conclusion // ""' <<<"$runs")
              [[ "$push" == success && "$pr" == success ]] && return 0
              if [[ "$push" =~ ^(failure|cancelled)$ || "$pr" =~ ^(failure|cancelled)$ ]]; then
                echo "CI failed for ${sha}: push=${push} pr=${pr}" >&2
                return 1
              fi
              sleep 15
            done
            return 1
          }
          ensure_checkpoint_ci() {
            local sha
            sha=$(checkpoint_sha "$1")
            [[ -n "$sha" ]] && wait_ci "$sha"
          }
          commit_checkpoint() {
            local message="$1" remote sha
            git diff --check
            remote=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
            test "$remote" = "$(git rev-parse HEAD)" || {
              echo "target branch changed: local=$(git rev-parse HEAD) remote=${remote}" >&2
              exit 1
            }
            git add -A
            git commit -m "$message"
            sha=$(git rev-parse HEAD)
            git push origin "HEAD:${TARGET_BRANCH}"
            wait_ci "$sha"
          }
          SH

          required=(
            'fix(gateway): fence replaced connections and preserve control sequence'
            'fix(relay): authorize encrypted frame persistence atomically'
            'fix(store): verify critical unique index contracts'
            'fix(gateway): keep session creation idempotency authoritative'
            'fix(relay): recover pending session controls'
            'fix(hc): persist encrypted outbox and scoped sequences'
            'fix(relay): isolate stale sessions and durable replay'
            'fix(gateway): reconnect on outbound backpressure'
            'fix(aba): accept delayed platform frame replay'
            'fix(relay): recover waiting key sessions from either endpoint'
            'fix(relay): fence ABA process incarnation changes'
            'fix(gateway): commit inbound control sequence after signature'
          )
          first_missing=''
          for message in "${required[@]}"; do
            if ! has_commit "$message"; then
              first_missing="$message"
              break
            fi
          done
          echo "FIRST_MISSING=${first_missing}" >> "$GITHUB_ENV"

          case "$first_missing" in
            ''|'fix(relay): fence ABA process incarnation changes'|'fix(gateway): commit inbound control sequence after signature')
              ;;
            *)
              gh run view "$CONVERGENCE_RUN" --repo "$REPO" --log-failed > /tmp/convergence-failure.log 2>&1 || true
              tail -n 120 /tmp/convergence-failure.log | sed -E 's/(token|secret|authorization)[^ ]*/[redacted]/Ig' > /tmp/convergence-failure-tail.log
              {
                echo "Convergence Run \`${CONVERGENCE_RUN}\` ended with \`${CONVERGENCE_CONCLUSION}\`."
                echo
                echo "First missing Review checkpoint: \`${first_missing}\`."
                echo
                echo "Run: ${CONVERGENCE_URL}"
                echo
                echo '<details><summary>Failed log tail</summary>'
                echo
                echo '```text'
                cat /tmp/convergence-failure-tail.log
                echo '```'
                echo '</details>'
                echo
                echo 'Probe stopped without guessing another code change. PR remains Draft and unmerged.'
              } > /tmp/failure-comment.md
              gh pr comment 1 --repo "$REPO" --body-file /tmp/failure-comment.md
              exit 1
              ;;
          esac

      - name: Add ABA process incarnation fencing when missing
        if: env.FIRST_MISSING == 'fix(relay): fence ABA process incarnation changes'
