import (
	"context"
	"time"

	"github.com/mss-boot-ai/harness-platform-monorepo/platform/internal/harness/domain"
	"gorm.io/gorm"
	"gorm.io/gorm/clause"
)

func (store *Store) FailSessionsForABAProcessRestart(
	ctx context.Context,
	endpoint domain.Endpoint,
	now time.Time,
) (int64, error) {
	if err := requireStore(store, ctx); err != nil {
		return 0, err
	}
	if endpoint.ID.IsZero() || endpoint.Type != domain.EndpointTypeABA || endpoint.OwnerUserID == "" || now.IsZero() {
		return 0, domain.NewProblem(domain.CodeInvalidArgument, "ABA restart scope is invalid", nil)
	}
	var affected int64
	err := store.db.WithContext(ctx).Transaction(func(tx *gorm.DB) error {
		var row endpointRow
		if err := tx.Clauses(clause.Locking{Strength: "UPDATE"}).Where(
			"id = ? AND owner_user_id = ? AND tenant_id = ? AND type = ? AND status = ?",
			endpoint.ID.String(), endpoint.OwnerUserID, endpoint.TenantID,
			string(domain.EndpointTypeABA), string(domain.EndpointStatusActive),
		).First(&row).Error; err != nil {
			return notFoundOr("lock ABA endpoint for process restart", "ABA endpoint was not found", err)
		}
		result := tx.Model(new(sessionRow)).Where(
			"aba_endpoint_id = ? AND owner_user_id = ? AND tenant_id = ? AND status IN ?",
			endpoint.ID.String(), endpoint.OwnerUserID, endpoint.TenantID,
			[]string{
				string(domain.SessionStatusCreating),
				string(domain.SessionStatusWaitingKey),
				string(domain.SessionStatusActive),
				string(domain.SessionStatusRekeyRequired),
				string(domain.SessionStatusDraining),
				string(domain.SessionStatusUncertain),
			},
		).Updates(map[string]any{
			"status":      string(domain.SessionStatusFailed),
			"closed_at":   now,
			"updated_at":  now,
			"row_version": gorm.Expr("row_version + 1"),
		})
		if result.Error != nil {
			return classifyPersistence(result.Error, "fail sessions after ABA process restart")
		}
		affected = result.RowsAffected
		return nil
	})
	return affected, err
}
''')

