import (
	"encoding/base64"
	"net/http/httptest"
	"testing"

	"github.com/mss-boot-ai/harness-platform-monorepo/platform/internal/harness/domain"
)

func TestABAProcessIncarnationChangesOnlyAcrossProcessRestart(t *testing.T) {
	server := &Server{abaProcessIncarnations: make(map[domain.ID][16]byte)}
	endpointID := gatewayID(141)
	first := [16]byte{1}
	second := [16]byte{2}
	if server.recordABAProcessIncarnation(endpointID, first) {
		t.Fatal("first process incarnation was treated as a restart")
	}
	if server.recordABAProcessIncarnation(endpointID, first) {
		t.Fatal("network reconnect with same process incarnation was treated as restart")
	}
	if !server.recordABAProcessIncarnation(endpointID, second) {
		t.Fatal("new process incarnation was not detected")
	}
}

func TestParseProcessIncarnationFailsClosedInProductionMode(t *testing.T) {
	previous := allowMissingABAProcessIncarnationForTests
	allowMissingABAProcessIncarnationForTests = false
	defer func() { allowMissingABAProcessIncarnationForTests = previous }()

	request := httptest.NewRequest("GET", "http://example.test/gateway/v1/ws", nil)
	if _, err := parseProcessIncarnation(request, domain.EndpointTypeABA); err == nil {
		t.Fatal("ABA without process incarnation was accepted")
	}
	request.Header.Set(abaProcessIncarnationHeader, base64.RawURLEncoding.EncodeToString([]byte{1, 2, 3}))
	if _, err := parseProcessIncarnation(request, domain.EndpointTypeABA); err == nil {
		t.Fatal("short process incarnation was accepted")
	}
	request.Header.Set(abaProcessIncarnationHeader, base64.RawURLEncoding.EncodeToString(make([]byte, 16)))
	if _, err := parseProcessIncarnation(request, domain.EndpointTypeABA); err == nil {
		t.Fatal("zero process incarnation was accepted")
	}
	value := [16]byte{9}
	request.Header.Set(abaProcessIncarnationHeader, base64.RawURLEncoding.EncodeToString(value[:]))
	parsed, err := parseProcessIncarnation(request, domain.EndpointTypeABA)
	if err != nil || parsed != value {
		t.Fatalf("parse valid incarnation=%x error=%v", parsed, err)
	}
	if _, err := parseProcessIncarnation(request, domain.EndpointTypeHCWeb); err == nil {
		t.Fatal("HC request carrying ABA process incarnation was accepted")
	}
}
''')

