apiVersion: mss.io/v1alpha1
kind: Project
metadata:
  name: harness-platform
  displayName: "Harness Platform"
  repository: mss-boot-ai/harness-platform-monorepo
spec:
  mission: Thin business host that consumes mss-boot-admin as exact-version backend and frontend dependencies while owning only business modules and composition glue.
  foundationVersion: 0.1.0
  distribution:
    name: mss-boot-admin
    version: v1.3.7
    backend:
      module: github.com/mss-boot-io/mss-boot-admin/admin
      version: v1.3.7
    frontend:
      package: "@mss-boot-io/admin-web"
      version: 1.3.7
  repositoryLayout:
    kind: thin-host
    backend: .
    frontend: web
    modules: internal/modules
    generated: web/src/generated
    businessRoutes: web/config/business-routes.generated.ts
    specifications: .mss
    documentation: docs
    reports: .mss/reports
  backend:
    language: go
    goVersion: "1.26.6"
    module: github.com/mss-boot-ai/harness-platform-monorepo/platform
    frameworkModule: github.com/mss-boot-io/mss-boot-admin/mss-boot
    httpFramework: gin
    orm: gorm
    cli: cobra
    authorization: casbin
    contract: openapi
  frontend:
    language: typescript
    nodeVersion: ">=24 <25"
    packageManager: pnpm
    packageManagerVersion: "10.34.5"
    framework: react
    applicationFramework: umi
    componentLibrary: ant-design
    defaultApplication: admin-web
    applications:
      - id: admin-web
        path: web
        role: primary
        nodeVersion: ">=24 <25"
        packageManager: pnpm
        packageManagerVersion: "10.34.5"
        developmentPort: 8001
  documentation:
    framework: markdown
    packageManager: none
  database:
    local: sqlite
    supported: [mysql, postgresql, sqlite]
  localDependencies:
    required: []
    optional: [redis, mysql, postgresql]
  conventions:
    newBusinessModuleLayout: vertical
    specificationFirst: true
    deterministicGeneration: true
    generatedFilesMustBeIdempotent: true
    writesDefaultToDryRun: true
    productionCredentialsRequiredForDevelopment: false
  entrypoints:
    admin: go run ./cmd/server server
    web: cd web && corepack pnpm@10.34.5 dev
  validation:
    changed: make verify
    all: make verify
    reports:
      json: .mss/reports/verify.json
      markdown: .mss/reports/verify.md
