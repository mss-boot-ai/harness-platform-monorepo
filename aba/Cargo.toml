[package]
name = "acp-brige-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false
description = "Lightweight local ACP bridge and security boundary for Harness Platform"

[lib]
name = "aba"
path = "src/lib.rs"

[[bin]]
name = "aba"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "aes", "nistp"] }
hkdf = "0.12.4"
p256 = { version = "0.13.2", features = ["ecdsa"] }
prost = "0.14.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
tempfile = "3.27.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
