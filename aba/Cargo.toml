[package]
name = "acp-brige-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false
description = "Lightweight local ACP bridge and security boundary for Harness Platform"

[lib]
name = "aba"
path = "src/lib.rs"

[[bin]]
name = "aba"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
