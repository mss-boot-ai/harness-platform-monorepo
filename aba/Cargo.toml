[package]
name = "acp-brige-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false
description = "Lightweight local ACP bridge and security boundary for Harness Platform"

[lib]
name = "aba"
path = "src/lib.rs"

[[bin]]
name = "aba"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
