syntax = "proto3";

package mss.awp.v1;

option go_package = "github.com/mss-boot-ai/harness-platform-monorepo/platform/internal/harness/protocol/awpv1;awpv1";

// WirePacket is the only top-level WebSocket binary payload in AWP v1.
// Every bytes identifier has a fixed length defined by the protocol document
// and must be validated before allocation-heavy or cryptographic processing.
message WirePacket {
  uint32 wire_major = 1;
  uint32 wire_minor = 2;
  bytes packet_id = 3; // 16 bytes.

  oneof body {
    ServerChallenge server_challenge = 10;
    ChallengeResponse challenge_response = 11;
    ConnectionReady connection_ready = 12;
    ControlFrame control = 13;
    EncryptedFrame encrypted = 14;
    AckFrame ack = 15;
    ErrorFrame error = 16;
  }
}

enum EndpointType {
  ENDPOINT_TYPE_UNSPECIFIED = 0;
  ENDPOINT_TYPE_ABA = 1;
  ENDPOINT_TYPE_HC_WEB = 2;
  ENDPOINT_TYPE_HC_MINIAPP = 3;
  ENDPOINT_TYPE_HC_NATIVE = 4;
  ENDPOINT_TYPE_HC_DESKTOP = 5;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_HC_TO_ABA = 1;
  DIRECTION_ABA_TO_HC = 2;
}

enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0;
  FRAME_TYPE_ACP_TRANSPORT_FRAME = 1;
}

enum ControlType {
  CONTROL_TYPE_UNSPECIFIED = 0;
  CONTROL_TYPE_HEARTBEAT = 1;
  CONTROL_TYPE_HEARTBEAT_ACK = 2;
  CONTROL_TYPE_RESUME_STATE = 3;
  CONTROL_TYPE_TRUST_MANIFEST_HINT = 4;
  CONTROL_TYPE_CREDENTIAL_STATUS_HINT = 5;
  CONTROL_TYPE_OPEN_TUNNEL_REQUEST = 6;
  CONTROL_TYPE_OPEN_TUNNEL_RESULT = 7;
  CONTROL_TYPE_CLOSE_TUNNEL_REQUEST = 8;
  CONTROL_TYPE_CLOSE_TUNNEL_RESULT = 9;
  CONTROL_TYPE_SESSION_KEY_PACKAGE = 10;
  CONTROL_TYPE_SESSION_KEY_PACKAGE_ACK = 11;
  CONTROL_TYPE_ROTATE_SESSION_KEY_REQUEST = 12;
  CONTROL_TYPE_ROTATE_SESSION_KEY_STATUS = 13;
  CONTROL_TYPE_ENDPOINT_DRAIN = 14;
}

enum OpenTunnelStatus {
  OPEN_TUNNEL_STATUS_UNSPECIFIED = 0;
  OPEN_TUNNEL_STATUS_ACCEPTED = 1;
  OPEN_TUNNEL_STATUS_REJECTED = 2;
  OPEN_TUNNEL_STATUS_ALREADY_OPEN = 3;
  OPEN_TUNNEL_STATUS_RESOURCE_BUSY = 4;
}

enum CloseTunnelStatus {
  CLOSE_TUNNEL_STATUS_UNSPECIFIED = 0;
  CLOSE_TUNNEL_STATUS_ACCEPTED = 1;
  CLOSE_TUNNEL_STATUS_ALREADY_CLOSED = 2;
  CLOSE_TUNNEL_STATUS_REJECTED = 3;
}

enum SessionKeyRotationState {
  SESSION_KEY_ROTATION_STATE_UNSPECIFIED = 0;
  SESSION_KEY_ROTATION_STATE_PENDING = 1;
  SESSION_KEY_ROTATION_STATE_DISTRIBUTING = 2;
  SESSION_KEY_ROTATION_STATE_READY = 3;
  SESSION_KEY_ROTATION_STATE_ACTIVE = 4;
  SESSION_KEY_ROTATION_STATE_GRACE = 5;
  SESSION_KEY_ROTATION_STATE_RETIRED = 6;
  SESSION_KEY_ROTATION_STATE_DESTROYED = 7;
  SESSION_KEY_ROTATION_STATE_FAILED = 8;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_PACKET = 1;
  ERROR_CODE_UNSUPPORTED_WIRE_VERSION = 2;
  ERROR_CODE_UNSUPPORTED_CRYPTO_SUITE = 3;
  ERROR_CODE_UNSUPPORTED_CONTROL_TYPE = 4;
  ERROR_CODE_UNKNOWN_CRITICAL_FLAG = 5;
  ERROR_CODE_UNAUTHORIZED_ENDPOINT = 6;
  ERROR_CODE_CREDENTIAL_EXPIRED = 7;
  ERROR_CODE_CREDENTIAL_REVOKED = 8;
  ERROR_CODE_POLICY_REVISION_STALE = 9;
  ERROR_CODE_TICKET_INVALID = 10;
  ERROR_CODE_CHALLENGE_FAILED = 11;
  ERROR_CODE_SESSION_NOT_FOUND = 12;
  ERROR_CODE_SESSION_NOT_AUTHORIZED = 13;
  ERROR_CODE_CHANNEL_NOT_FOUND = 14;
  ERROR_CODE_RUNTIME_NOT_ALLOWED = 15;
  ERROR_CODE_WORKSPACE_NOT_ALLOWED = 16;
  ERROR_CODE_KEY_GENERATION_STALE = 17;
  ERROR_CODE_KEY_PACKAGE_REQUIRED = 18;
  ERROR_CODE_SIGNATURE_INVALID = 19;
  ERROR_CODE_AEAD_FAILED = 20;
  ERROR_CODE_SEQUENCE_REPLAY = 21;
  ERROR_CODE_SEQUENCE_WINDOW_EXCEEDED = 22;
  ERROR_CODE_ACK_INVALID = 23;
  ERROR_CODE_REPLAY_DATA_UNAVAILABLE = 24;
  ERROR_CODE_BACKPRESSURE = 25;
  ERROR_CODE_QUOTA_EXCEEDED = 26;
  ERROR_CODE_LOCAL_DISPATCH_UNCERTAIN = 27;
  ERROR_CODE_INTERNAL_TEMPORARY = 28;
}

message ServerChallenge {
  bytes connection_id = 1; // 16 bytes.
  uint64 connection_generation = 2;
  bytes server_nonce = 3; // 32 bytes.
  int64 server_time_ms = 4;
  uint64 trust_manifest_revision = 5;
  uint64 credential_status_revision = 6;
  bytes server_signature = 7; // ES256 P1363 R || S, 64 bytes.
}

message ChallengeResponse {
  bytes connection_id = 1; // 16 bytes.
  uint64 connection_generation = 2;
  bytes endpoint_id = 3; // 16 bytes.
  bytes credential_serial = 4; // 16 bytes.
  bytes client_nonce = 5; // 32 bytes.
  uint64 last_manifest_revision = 6;
  uint64 last_credential_status_revision = 7;
  bytes endpoint_signature = 8; // ES256 P1363 R || S, 64 bytes.
}

message ConnectionReady {
  bytes connection_id = 1; // 16 bytes.
  uint64 connection_generation = 2;
  bytes fencing_token = 3; // 32 bytes.
  int64 ready_at_ms = 4;
  uint32 max_packet_bytes = 5;
  uint32 max_inflight_frames = 6;
  uint32 heartbeat_interval_ms = 7;
  bytes server_signature = 8; // ES256 P1363 R || S, 64 bytes.
}

// ControlFrame payload contains exactly one serialized type selected by type.
// Control frames are signed but do not contain plaintext ACP JSON-RPC.
message ControlFrame {
  bytes message_id = 1; // 16 bytes.
  bytes sender_endpoint_id = 2; // 16 bytes; all-zero is reserved for Platform control identity.
  bytes receiver_endpoint_id = 3; // 16 bytes.
  uint64 control_sequence = 4;
  int64 created_at_ms = 5;
  ControlType type = 6;
  bytes payload = 7;
  bytes signature = 8; // ES256 P1363 R || S, 64 bytes.
}

// EncryptedFrame is immutable after the sender signs it. A replay must transmit
// the exact same bytes; Platform must not toggle flags or rewrite timestamps.
message EncryptedFrame {
  uint32 crypto_suite_id = 1;
  FrameType frame_type = 2;
  uint32 flags = 3;

  bytes message_id = 4; // 16 bytes.
  bytes channel_id = 5; // 16 bytes.
  bytes session_id = 6; // 16 bytes.
  bytes sender_endpoint_id = 7; // 16 bytes.
  bytes receiver_endpoint_id = 8; // 16 bytes.

  Direction direction = 9;
  uint64 sequence = 10;
  uint64 key_generation = 11;
  bytes key_id = 12; // 16 bytes.
  int64 created_at_ms = 13;

  bytes ciphertext = 14; // AES-GCM ciphertext including the authentication tag.
  bytes signature = 15; // ES256 P1363 R || S, 64 bytes.
}

message SequenceRange {
  uint64 start = 1;
  uint64 end = 2; // Inclusive.
}

message AckFrame {
  bytes ack_id = 1; // 16 bytes.
  bytes channel_id = 2; // 16 bytes.
  bytes session_id = 3; // 16 bytes.
  bytes endpoint_id = 4; // ACK sender, 16 bytes.
  Direction acknowledged_direction = 5;
  uint64 highest_contiguous_sequence = 6;
  repeated SequenceRange received_ranges = 7;
  uint64 key_generation = 8;
  int64 created_at_ms = 9;
  bytes signature = 10; // ES256 P1363 R || S, 64 bytes.
}

message ErrorFrame {
  bytes error_id = 1; // 16 bytes.
  bytes related_message_id = 2; // 16 zero bytes when not applicable.
  ErrorCode code = 3;
  bool retryable = 4;
  uint32 retry_after_ms = 5;
  string safe_message = 6;
  bytes signature = 7; // Platform or endpoint signature, 64 bytes for Suite 0001.
}

message Heartbeat {
  bytes connection_id = 1; // 16 bytes.
  uint64 connection_generation = 2;
  uint64 monotonic_counter = 3;
  uint32 active_session_count = 4;
  uint32 journal_usage_basis_points = 5;
  uint64 trust_manifest_revision = 6;
  uint64 credential_status_revision = 7;
}

message HeartbeatAck {
  bytes connection_id = 1; // 16 bytes.
  uint64 connection_generation = 2;
  uint64 acknowledged_counter = 3;
  int64 server_time_ms = 4;
  uint32 next_interval_ms = 5;
}

message ResumeState {
  repeated ChannelCursor cursors = 1;
}

message ChannelCursor {
  bytes channel_id = 1; // 16 bytes.
  Direction direction = 2;
  uint64 highest_contiguous_sequence = 3;
  repeated SequenceRange received_ranges = 4;
  uint64 key_generation = 5;
}

message TrustManifestHint {
  uint64 trust_manifest_revision = 1;
  int64 refresh_before_ms = 2;
}

message CredentialStatusHint {
  uint64 credential_status_revision = 1;
  bytes credential_serial = 2; // 16 bytes.
  int64 refresh_before_ms = 3;
}

// Platform sends only identifiers and authorization metadata. Real executable,
// arguments, environment and filesystem paths are exclusively local ABA data.
message OpenTunnelRequest {
  bytes session_id = 1; // 16 bytes.
  bytes hc_endpoint_id = 2; // 16 bytes.
  string runtime_profile_id = 3;
  string workspace_id = 4;
  uint64 authorization_revision = 5;
  uint64 requested_key_generation = 6;
  repeated string requested_acp_capabilities = 7;
  int64 expires_at_ms = 8;
}

message OpenTunnelResult {
  bytes session_id = 1; // 16 bytes.
  OpenTunnelStatus status = 2;
  string stable_error_code = 3;
  uint64 accepted_authorization_revision = 4;
  uint64 active_key_generation = 5;
  repeated string negotiated_capability_hints = 6;
}

message CloseTunnelRequest {
  bytes session_id = 1; // 16 bytes.
  string stable_reason_code = 2;
  int64 expires_at_ms = 3;
}

message CloseTunnelResult {
  bytes session_id = 1; // 16 bytes.
  CloseTunnelStatus status = 2;
  string stable_error_code = 3;
}

message SessionKeyPackage {
  bytes session_id = 1; // 16 bytes.
  uint64 key_generation = 2;
  bytes issuer_aba_endpoint_id = 3; // 16 bytes.
  bytes recipient_hc_endpoint_id = 4; // 16 bytes.
  string crypto_suite = 5;
  bytes hpke_enc = 6;
  bytes hpke_ciphertext = 7;
  int64 not_before_ms = 8;
  int64 expires_at_ms = 9;
  bytes issuer_signature = 10; // ES256 P1363 R || S, 64 bytes.
  bytes key_package_id = 11; // 16 bytes, generated by the ABA.
  bytes issuer_credential_id = 12; // ABA credential serial, 16 bytes.
  uint64 policy_revision = 13;
}

message SessionKeyPackageAck {
  bytes session_id = 1; // 16 bytes.
  uint64 key_generation = 2;
  bytes key_package_id = 3; // 16 bytes.
  bytes recipient_hc_endpoint_id = 4; // 16 bytes.
  int64 acknowledged_at_ms = 5;
}

message RotateSessionKeyRequest {
  bytes session_id = 1; // 16 bytes.
  uint64 requested_generation = 2;
  string stable_reason_code = 3;
  uint64 participant_revision = 4;
  int64 expires_at_ms = 5;
}

message RotateSessionKeyStatus {
  bytes session_id = 1; // 16 bytes.
  uint64 key_generation = 2;
  SessionKeyRotationState state = 3;
  string stable_error_code = 4;
}

message EndpointDrain {
  bytes endpoint_id = 1; // 16 bytes.
  string stable_reason_code = 2;
  int64 deadline_ms = 3;
  uint64 credential_status_revision = 4;
}
