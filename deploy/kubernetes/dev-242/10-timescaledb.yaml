apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-timescaledb-init
  namespace: harness-dev
data:
  001-timescaledb.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb;
---
apiVersion: v1
kind: Service
metadata:
  name: harness-timescaledb
  namespace: harness-dev
  labels:
    app.kubernetes.io/name: harness-timescaledb
    app.kubernetes.io/part-of: harness-platform
spec:
  selector:
    app.kubernetes.io/name: harness-timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harness-timescaledb
  namespace: harness-dev
  labels:
    app.kubernetes.io/name: harness-timescaledb
    app.kubernetes.io/part-of: harness-platform
spec:
  serviceName: harness-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-timescaledb
        app.kubernetes.io/part-of: harness-platform
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.29.2-pg16@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: harness
            - name: POSTGRES_USER
              value: harness
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harness-database
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TIMESCALEDB_TELEMETRY
              value: "off"
            - name: TS_TUNE_MEMORY
              value: 768MB
            - name: TS_TUNE_NUM_CPUS
              value: "1"
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "harness", "-d", "harness"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "harness", "-d", "harness"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "harness", "-d", "harness"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001-timescaledb.sql
              subPath: 001-timescaledb.sql
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: harness-timescaledb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: HARNESS_STORAGE_CLASS
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
