server:
  addr: 0.0.0.0:8080
  metrics: true
  healthz: true
  readyz: true
  pprof: false
monitor:
  sampleInterval: 5s
  sampleTimeout: 3s
  historySize: 120
presentation:
  recoveryMode: false
  adoptionMode: active
  activePages:
    - user.list
    - role.list
    - menu.list
    - department.list
    - post.list
    - task.list
    - notice.list
    - language.list
    - option.list
    - system-config.list
    - online-session.list
    - log.login
    - log.audit
    - log.runtime
application:
  mode: prod
  origin: https://platform-dev.mss-boot-io.top
  trustedProxies: []
  labels:
    app: harness-platform
    namespace: harness-dev
    cluster: dev-242
cors:
  allowOrigins:
    - https://platform-dev.mss-boot-io.top
    - https://hc-dev.mss-boot-io.top
  allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowHeaders:
    - Authorization
    - Content-Type
    - If-Match
    - Idempotency-Key
    - X-CSRF-Token
  exposeHeaders: [ETag]
  maxAge: 12h
logger:
  stdout: stderr
  level: info
  json: true
  addSource: false
database:
  driver: postgres
  source: '{{.Env.HARNESS_DATABASE_DSN}}'
  connMaxIdleTime: 300
  connMaxLifeTime: 3600
  maxIdleConns: 5
  maxOpenConns: 30
  config:
    disableForeignKeyConstraintWhenMigrating: true
    translateError: true
  casbinModel: |
    [request_definition]
    r = sub, tp, obj, act

    [policy_definition]
    p = sub, tp, obj, act

    [policy_effect]
    e = some(where (p.eft == allow))

    [matchers]
    m = r.sub == p.sub && r.tp == p.tp && keyMatch(r.obj, p.obj) && regexMatch(r.act, p.act)
auth:
  realm: harness-platform-dev
  key: '{{.Env.HARNESS_ADMIN_AUTH_KEY}}'
  identityKey: '{{.Env.HARNESS_ADMIN_IDENTITY_KEY}}'
  timeout: 12h
  maxRefresh: 2160h
  browserSession:
    secure: true
    sameSite: lax
    webSocketTicketTTL: 30s
challenge:
  enabled: false
  required: false
pyroscope:
  enabled: false
task:
  enable: false
